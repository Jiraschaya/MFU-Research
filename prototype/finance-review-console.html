<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตรวจการเงิน — RGMS ทุนวิจัย มฟล.</title>
<link rel="stylesheet" href="style.css">
<style>
  /* จุดสถานะ: เขียว = ตรวจแล้ว / เหลือง = รอตรวจ + กระพริบ */
  .status-badge::before { animation: status-blink 1.2s ease-in-out infinite; }
  .status-badge--done::before { background: #10B981; box-shadow: 0 0 8px 2px rgba(16, 185, 129, .65); }
  .status-badge--wait::before { background: #F5B301; box-shadow: 0 0 8px 2px rgba(245, 179, 1, .75); }
  @keyframes status-blink {
    0%, 100% { opacity: 1;   transform: scale(1.1); }
    50%      { opacity: .25; transform: scale(.8); }
  }
  @media (prefers-reduced-motion: reduce) { .status-badge::before { animation: none; } }

  /* นำขอบสีแดงเข้มตอนชี้เมาส์ที่ปุ่มออก */
  .btn-secondary:hover { border-color: #CBD5E1 !important; color: var(--color-primary-strong) !important; }
  .btn-primary:hover   { border-color: #680E12 !important; }

  /* ปุ่มผลการตรวจ 2 สี (โทนนุ่ม ไม่สดเกินไป) */
  .rec-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .rec-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 40px; padding: 0 16px; border-radius: 8px;
    border: 1px solid transparent; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; opacity: .6;                         /* ยังไม่เลือก = จางลงเล็กน้อย */
    transition: opacity .15s, box-shadow .15s, transform .15s;
  }
  .rec-btn:hover { opacity: .85; transform: translateY(-1px); }
  .rec-btn--ok   { background: #3F8F6B; border-color: #2F7556; color: #fff; }
  .rec-btn--warn { background: #E0B04A; border-color: #C79A36; color: #3B2A00; }
  .rec-btn.is-active { opacity: 1; transform: none; box-shadow: 0 2px 8px rgba(15, 23, 42, .22); }
  .rec-btn.is-active::before { content: "\2713"; font-weight: 700; }     /* ติ๊กถูกหน้าข้อความ */
  /* ล็อกหลังบันทึกผลตรวจ */
  .rec-btn:disabled { cursor: not-allowed; }
  .rec-btn:disabled:not(.is-active):hover { opacity: .6; transform: none; }
  .field__control[readonly] { background: #F1F5F9; color: #475569; cursor: not-allowed; resize: none; }
  .lock-note { display: none; margin-bottom: 12px; }
  .is-locked .lock-note { display: flex; }
</style>
</head>
<body>
<div id="app-nav-root"></div>
<main class="section">
  <div class="container stack gap-4" id="root"></div>
</main>

<script src="shared.js"></script>
<script>
  RGMS.renderAppNav("finance-review-queue");
  var me = RGMS.currentRole().name;
  var id = new URLSearchParams(location.search).get("id") || "P-2569-037";
  var p = RGMS.getProject(id);
  var root = document.getElementById("root");
  if (!p) { root.innerHTML = '<div class="notice notice--reject">ไม่พบโครงการ ' + id + '</div>'; }
  else render();

  /* ประเภททุนของโครงการ (ชื่อเต็ม) */
  function tierLabel(p) { return (p.tier && RGMS.TIERS[p.tier]) ? RGMS.TIERS[p.tier].label : ""; }

  /* การ์ดประเภททุน + เพดานงบประมาณ (แทนการ์ดบทคัดย่อ) */
  function tierCardHTML(p) {
    var t = p.tier && RGMS.TIERS[p.tier];
    if (!t) return '<div class="card"><h2 class="text-subhead" style="margin-bottom:8px;">ประเภททุนและเพดานงบประมาณ</h2><p class="text-sm text-muted">ไม่ได้ระบุประเภททุน</p></div>';
    var over = p.budgetReq - t.cap;
    var verdictBadge = over > 0
      ? '<span class="badge badge-reject">เกินเพดาน ' + RGMS.fmtBaht(over) + '</span>'
      : '<span class="badge badge-ok">ไม่เกินเพดาน</span>';
    return '<div class="card"><h2 class="text-subhead" style="margin-bottom:12px;">ประเภททุนและเพดานงบประมาณ</h2>' +
      '<div style="display:flex; flex-wrap:wrap; gap:16px 40px; align-items:flex-start;">' +
        '<div><span class="text-overline">ประเภททุน</span><div style="font-weight:600; font-size:18px; margin-top:4px;">' + t.label + '</div></div>' +
        '<div><span class="text-overline">เพดานงบประมาณ</span><div class="text-mono" style="font-weight:600; font-size:18px; margin-top:4px;">' + RGMS.fmtBaht(t.cap) + '</div></div>' +
        '<div><span class="text-overline">งบที่ขอ</span><div class="text-mono" style="font-weight:600; font-size:18px; margin-top:4px;">' + RGMS.fmtBaht(p.budgetReq) + '</div></div>' +
      '</div>' +
      '<div style="margin-top:12px;">' + verdictBadge + '</div></div>';
  }

  function render() {
    var owner = RGMS.financeOwnerOf(p.id);
    var head =
      '<div class="page-head"><div class="breadcrumb"><a href="finance-review-queue.html">← คิวตรวจการเงิน</a></div>' +
        '<div class="cluster gap-2"><span class="text-mono text-muted">' + p.id + '</span>' + RGMS.badgeHTML("review") + '</div>' +
        '<h1 class="text-title">' + p.title + '</h1>' +
        '<p class="text-sm text-muted">' + p.school + (tierLabel(p) ? ' · ' + tierLabel(p) : '') + ' · งบที่ขอ ' + RGMS.fmtBaht(p.budgetReq) + '</p></div>';

    // ยังไม่มีใคร claim — ต้องรับตรวจก่อนจึงจะเห็นแบบฟอร์ม
    if (!owner) {
      root.innerHTML = head +
        '<div class="card card--alt stack gap-3"><h2 class="text-subhead">ยังไม่มีผู้รับผิดชอบแทร็กการเงินของโครงการนี้</h2>' +
        '<p class="text-sm text-muted">กด "รับตรวจ" เพื่อผูกตัวเองเป็นผู้รับผิดชอบแทร็กการเงินของโครงการนี้ต่อเนื่องทุกรอบ (claim-based · FR-83)</p>' +
        '<button class="btn btn-primary btn-md" id="claim-btn" style="align-self:flex-start;">รับตรวจโครงการนี้</button></div>';
      document.getElementById("claim-btn").addEventListener("click", function () {
        RGMS.claimFinance(p.id, me);
        RGMS.refreshNavCounts();
        render();
      });
      return;
    }

    // มีคน claim แล้วแต่ไม่ใช่ฉัน — read-only
    if (owner !== me) {
      root.innerHTML = head +
        '<div class="notice notice--wait"><span class="notice__title">โครงการนี้มีผู้รับผิดชอบแทร็กการเงินแล้ว</span>' +
        '<span class="notice__body">ผู้รับผิดชอบ: ' + owner + ' — ท่านอื่นไม่สามารถตรวจซ้ำได้ (กันการแย่งงาน/ตรวจซ้อน)</span></div>' +
        (RGMS.financeComment(p.id) ? '<div class="card"><h2 class="text-subhead" style="margin-bottom:8px;">ความเห็นล่าสุด</h2><p class="text-sm text-muted">“' + RGMS.financeComment(p.id) + '”</p></div>' : '');
      return;
    }

    var curStatus = RGMS.financeTrackStatus(p.id);
    var curComment = RGMS.financeComment(p.id);
    /* ถ้าบันทึกผลตรวจแล้ว (สถานะไม่ใช่ pending) → แสดงของเดิมและล็อกฟอร์ม; ถ้ายัง → ฟอร์มว่าง */
    var locked = curStatus !== "pending";
    var verdict = locked ? curStatus : null;

    var grid =
      '<div class="grid" style="grid-template-columns: 1fr 380px; align-items:start;" id="grid"></div>';
    root.innerHTML = head + grid;

    var left =
      '<div class="stack gap-4">' +
        tierCardHTML(p) +
        '<div class="card"><h2 class="text-subhead" style="margin-bottom:12px;">งบประมาณที่ขอ (ตาราง 17.2)</h2>' + RGMS.budgetTableHTML(p) + '</div>' +
        '<div class="card"><h2 class="text-subhead" style="margin-bottom:12px;">เอกสารประกอบด้านการเงิน</h2><div class="stack gap-2">' +
          ['รายละเอียดงบประมาณ 17.2 (PDF)', 'ใบเสนอราคา/อัตราค่าบริการ (ถ้ามี)', 'TOR รายการจ้างเหมา (ถ้ามี)'].map(function (d) {
            return '<div class="doc-row"><span class="doc-row__icon">PDF</span><div class="flex-1" style="font-weight:600; font-size:14px;">' + d + '</div><button class="btn btn-secondary btn-sm">เปิดดู</button></div>';
          }).join("") +
        '</div></div>' +
      '</div>';

    var right =
      '<div class="card' + (locked ? ' is-locked' : '') + '" id="form-card" style="position:sticky; top:16px;">' +
        '<div class="notice notice--ok lock-note"><span class="notice__title">บันทึกผลตรวจแล้ว</span><span class="notice__body">ผลการตรวจและข้อคิดเห็นถูกล็อก ไม่สามารถแก้ไขได้</span></div>' +
        '<h2 class="text-subhead" style="margin-bottom:4px;">แบบตรวจการเงิน (แทร็กการเงิน)</h2>' +
        '<p class="text-sm text-muted" style="margin-bottom:12px;">ผู้รับผิดชอบ: ' + owner + ' — ตรวจเพดานงบ/รายการ/การแบ่งงวด ตามตาราง 17.2</p>' +
        '<span class="text-overline">ประเด็นตรวจการเงิน</span>' +
        '<ul style="margin:6px 0 16px; padding-left:18px; font-size:13px; color:var(--color-text-muted); line-height:1.7;">' +
          ['ยอดรวมไม่เกินเพดานตามประเภททุน', 'รายการที่ต้องแนบเอกสาร (TOR/ใบเสนอราคา/กำหนดการ) ครบถ้วน', 'หมวดค่าเดินทาง/ครุภัณฑ์ไม่เกิน 25% ของงบรวม', 'การแบ่งงวดถูกต้องตามเกณฑ์'].map(function (a) { return '<li>' + a + '</li>'; }).join("") + '</ul>' +
        '<label class="field__label">ผลการตรวจ <span class="req">*</span></label>' +
        '<div class="rec-group" id="rec" style="margin:6px 0 16px;">' +
          [['cleared','รับรองงบประมาณ','rec-btn--ok'],['commented','ให้ปรับแก้งบประมาณ','rec-btn--warn']].map(function (o) {
            return '<button type="button" class="rec-btn ' + o[2] + '"' + (locked ? ' disabled' : '') + ' data-rec="' + o[0] + '">' + o[1] + '</button>';
          }).join("") + '</div>' +
        '<div class="field"><label class="field__label">ข้อคิดเห็น / ข้อเสนอแนะด้านการเงิน <span class="req" id="cstar" style="' + (verdict === "commented" ? '' : 'display:none') + '">*</span></label>' +
          '<textarea class="field__control" id="comment"' + (locked ? ' readonly' : '') + ' style="min-height:140px;" placeholder="ระบุรายการที่เกินเพดาน เอกสารที่ขาด หรือการแบ่งงวดที่ต้องแก้ไข">' + (curComment || '') + '</textarea></div>' +
        '<button class="btn btn-primary btn-lg btn-block" id="submit" disabled>' + (locked ? 'บันทึกผลตรวจแล้ว' : 'บันทึกผลตรวจการเงิน') + '</button>' +
        '<p class="text-sm text-muted text-center" id="hint" style="margin-top:8px;"></p>' +
      '</div>';

    document.getElementById("grid").innerHTML = left + right;

    function recompute() {
      if (locked) {
        document.getElementById("hint").textContent = "ล็อกแล้ว — ทดสอบใหม่ได้โดยกดปุ่มรีเซ็ตที่หน้าคิวตรวจการเงิน";
        return;
      }
      document.getElementById("cstar").style.display = verdict === "commented" ? "" : "none";
      var hasComment = document.getElementById("comment").value.trim().length > 0;
      var ok = verdict === "cleared" || (verdict === "commented" && hasComment);
      document.getElementById("submit").disabled = !ok;
      document.getElementById("hint").textContent = ok ? "พร้อมบันทึกผลตรวจ" : (!verdict ? "เลือกผลการตรวจ" : "กรอกข้อคิดเห็น/ข้อเสนอแนะ (บังคับเมื่อให้ปรับแก้)");
    }
    document.getElementById("rec").addEventListener("click", function (e) {
      if (locked) return;
      var b = e.target.closest("[data-rec]"); if (!b) return;
      verdict = b.getAttribute("data-rec");
      document.querySelectorAll("#rec .rec-btn").forEach(function (x) { x.classList.remove("is-active"); });
      b.classList.add("is-active");
      recompute();
    });
    document.getElementById("comment").addEventListener("input", recompute);
    if (verdict) { var rb = document.querySelector('[data-rec="' + verdict + '"]'); if (rb) rb.classList.add("is-active"); }
    recompute();

    document.getElementById("submit").addEventListener("click", function () {
      RGMS.setFinanceTrackStatus(p.id, verdict);
      RGMS.setFinanceComment(p.id, document.getElementById("comment").value.trim());
      RGMS.refreshNavCounts();   // ลดเลขแจ้งเตือนใน sidebar ทันที
      var ok = verdict === "cleared";
      RGMS.modal({
        title: "บันทึกผลตรวจการเงินแล้ว",
        body: '<div class="notice notice--' + (ok ? "ok" : "wait") + '"><span class="notice__title">แทร็กการเงิน: ' + (ok ? "รับรองแล้ว" : "มีข้อคิดเห็น · ต้องแก้ไข") + '</span>' +
          '<span class="notice__body">แทร็กเนื้อหาทำงานเป็นอิสระ ไม่ต้องรอกัน — โครงการจะพร้อมเข้า คกก.ส่งเสริม เมื่อทั้ง 2 แทร็กรับรองพร้อมกัน (FR-85)</span></div>',
        foot: '<a class="btn btn-primary btn-md" href="finance-review-queue.html">กลับคิวตรวจการเงิน</a>'
      });
      render();   // วาดใหม่ → ฟอร์มถูกล็อก (locked = สถานะไม่ใช่ pending)
    });
  }
</script>
</body>
</html>
