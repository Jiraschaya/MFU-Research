<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รับรองข้อเสนอ (สำนักวิชา) — RGMS ทุนวิจัย มฟล.</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .review-item {
            overflow-wrap: anywhere;
        }

        .review-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .review-empty {
            padding: 20px 12px;
            text-align: center;
            color: var(--color-muted, #64748b);
        }

        .review-section {
            scroll-margin-top: 24px;
        }

        /* การ์ดสถิติ: ใช้รูปแบบเดียวกับหน้าเลขานุการ */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            width: 100%;
        }

        .kpi-card {
            appearance: none;
            -webkit-appearance: none;
            position: relative;
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 125px;
            padding: 24px 28px;
            overflow: hidden;

            text-align: left;
            font: inherit;
            color: #0f172a;

            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);

            cursor: pointer;
            transition:
                transform 0.16s ease,
                box-shadow 0.16s ease,
                background 0.16s ease;
        }

        /* แถบสีแดงไล่ไปสีทอง */
        .kpi-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #991b1b, #c79a24);
        }

        .kpi-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
        }

        .kpi-card:focus-visible {
            outline: 3px solid #2563eb;
            outline-offset: 3px;
        }

        .kpi-card[aria-pressed="true"] {
            background: #fffaf0;
            box-shadow:
                0 0 0 2px rgba(183, 138, 34, 0.25),
                0 4px 12px rgba(15, 23, 42, 0.06);
        }

        .kpi-card__value {
            display: block;
            margin-bottom: 6px;
            font-size: 36px;
            line-height: 1.15;
            font-weight: 700;
        }

        .kpi-card__label {
            display: block;
            font-size: 15px;
            line-height: 1.45;
            color: #334155;
        }

        @media (max-width: 1000px) {
            .kpi-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 560px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }

            .kpi-card {
                min-height: 110px;
                padding: 20px;
            }

            .review-actions > * {
                flex: 1 1 100%;
                justify-content: center;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div id="app-nav-root"></div>

<main class="section">
    <div class="container stack gap-5">

        <!-- ส่วนหัว -->
        <div class="page-head">
            <span class="text-overline">
                เฟส 1 · เปิดรับและพิจารณา · การรับรองระดับสำนักวิชา (FR-74)
            </span>

            <h1 class="text-headline">
                รับรองข้อเสนอโครงการ (สำนักวิชา)
            </h1>

            <p class="text-muted" id="sub"></p>
        </div>

        <!-- สถิติ -->
        <div
            class="kpi-grid"
            id="kpis"
            aria-label="สรุปการรับรอง กดการ์ดเพื่อกรองรายการ">
        </div>

        <!-- รายการรอรับรอง -->
        <section
            id="pending-section"
            class="card card--featured card--pad-sm review-section"
            aria-labelledby="pending-heading">

            <div class="card__header">
                <div>
                    <h2 class="text-subhead" id="pending-heading">
                        รอประธานวิจัย/คณบดีพิจารณา
                    </h2>

                    <p class="text-sm text-muted">
                        ข้อเสนอที่นักวิจัยยื่นเข้ามา
                        สามารถรับรองเพื่อส่งต่อส่วนบริหารงานวิจัย
                        หรือส่งกลับให้นักวิจัยแก้ไข
                    </p>
                </div>
            </div>

            <div class="stack gap-3" id="pending" aria-live="polite"></div>
        </section>

        <!-- รายการที่ดำเนินการแล้ว -->
        <section
            id="done-section"
            class="card card--featured card--pad-sm review-section"
            aria-labelledby="done-heading">

            <div class="card__header">
                <div>
                    <h2 class="text-subhead" id="done-heading">
                        ดำเนินการแล้ว
                    </h2>

                    <p class="text-sm text-muted">
                        รายการที่รับรองแล้วหรือส่งกลับให้นักวิจัยแก้ไข
                    </p>
                </div>
            </div>

            <div class="stack gap-2" id="done" aria-live="polite"></div>
        </section>

    </div>
</main>

<script src="shared.js"></script>

<script>
(function () {
    "use strict";

    if (typeof RGMS === "undefined") {
        document.getElementById("sub").textContent =
            "ไม่สามารถโหลด RGMS ได้ กรุณาตรวจสอบ shared.js";
        return;
    }

    RGMS.renderAppNav("chair-review");

    var role = RGMS.currentRole() || {};
    var school = role.school || "สำนักวิชาเทคโนโลยีสารสนเทศ";

    var pendingElement = document.getElementById("pending");
    var doneElement = document.getElementById("done");
    var kpiElement = document.getElementById("kpis");

    var selectedKPI = "all";
    var busyIds = new Set();

    document.getElementById("sub").textContent =
        (role.name || "ผู้ใช้งาน") + " · " + school;


    // ป้องกันข้อมูลข้อความถูกแปลความหมายเป็น HTML
    function escapeHTML(value) {
        return String(value == null ? "" : value).replace(
            /[&<>"']/g,
            function (char) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[char];
            }
        );
    }


    // ดึงโครงการของสำนักวิชาปัจจุบัน
    function getProjects() {
        if (!Array.isArray(RGMS.PROJECTS)) {
            return [];
        }

        return RGMS.PROJECTS.filter(function (project) {
            return project && project.school === school;
        });
    }


    // สถานะโครงการที่อยู่ในขั้นตอนรับรอง
    function isEligibleForEndorsement(project) {
        return ["submitted", "screening"].indexOf(project.status) >= 0;
    }


    // สถานะการรับรอง
    function getEndorsementStatus(project) {
        return RGMS.endorseStatus(project.id);
    }


    // ตรวจสอบว่าสามารถรับรองหรือส่งกลับได้หรือไม่
    function canEndorse(projectId) {
        var project = getProjects().find(function (project) {
            return String(project.id) === String(projectId);
        });

        return !!project &&
            isEligibleForEndorsement(project) &&
            getEndorsementStatus(project) === "pending";
    }


    function emptyMessage(message) {
        return '<div class="text-sm text-muted review-empty">' +
            escapeHTML(message) +
            '</div>';
    }


    function endorsementLabel(status) {
        if (status === "passed") {
            return '<span class="badge badge-ok">' +
                'รับรองแล้ว · ส่งส่วนบริหาร' +
                '</span>';
        }

        if (status === "returned") {
            return '<span class="badge badge-revise">' +
                'ส่งกลับให้นักวิจัยแก้ไข' +
                '</span>';
        }

        return '<span class="badge">รอดำเนินการ</span>';
    }


    // สร้างการ์ดสถิติ
    function renderKPIs(pendingCount, passedCount, returnedCount) {
        var cards = [
            {
                id: "pending",
                label: "รอรับรอง",
                value: pendingCount
            },
            {
                id: "passed",
                label: "รับรองแล้ว",
                value: passedCount
            },
            {
                id: "returned",
                label: "ส่งกลับแก้ไข",
                value: returnedCount
            }
        ];

        kpiElement.innerHTML = cards.map(function (card) {
            return `
                <button
                    type="button"
                    class="kpi-card"
                    data-kpi="${card.id}"
                    aria-pressed="${selectedKPI === card.id}"
                    aria-controls="${
                        card.id === "pending"
                            ? "pending-section"
                            : "done-section"
                    }">

                    <span class="kpi-card__value">
                        ${card.value}
                    </span>

                    <span class="kpi-card__label">
                        ${escapeHTML(card.label)} · โครงการ
                    </span>
                </button>
            `;
        }).join("");
    }


    // แสดงข้อมูลทั้งหมด
    function render() {
        var projects = getProjects();

        // โครงการที่รอรับรอง
        var pending = projects.filter(function (project) {
            return isEligibleForEndorsement(project) &&
                getEndorsementStatus(project) === "pending";
        });

        // โครงการที่ดำเนินการแล้ว
        var allDone = projects.filter(function (project) {
            var status = getEndorsementStatus(project);

            return status === "passed" || status === "returned";
        });

        var passedCount = allDone.filter(function (project) {
            return getEndorsementStatus(project) === "passed";
        }).length;

        var returnedCount = allDone.filter(function (project) {
            return getEndorsementStatus(project) === "returned";
        }).length;

        // กรองรายการตามการ์ดที่เลือก
        var visibleDone = allDone.filter(function (project) {
            var status = getEndorsementStatus(project);

            if (selectedKPI === "passed") {
                return status === "passed";
            }

            if (selectedKPI === "returned") {
                return status === "returned";
            }

            return true;
        });

        // วาดการ์ดสถิติ
        renderKPIs(
            pending.length,
            passedCount,
            returnedCount
        );

        // แสดงส่วนที่สัมพันธ์กับการ์ดที่เลือก
        document.getElementById("pending-section").hidden =
            selectedKPI === "passed" || selectedKPI === "returned";

        document.getElementById("done-section").hidden =
            selectedKPI === "pending";


        // แสดงรายการรอรับรอง
        if (pending.length === 0) {
            pendingElement.innerHTML = emptyMessage(
                "ไม่มีข้อเสนอรอรับรองในสำนักวิชานี้"
            );
        } else {
            pendingElement.innerHTML = pending.map(function (project) {
                var tier = RGMS.tierOf(project) || {};
                var id = String(project.id);

                var detailURL =
                    "project-detail.html?id=" +
                    encodeURIComponent(id);

                return `
                    <article class="card card--alt card--pad-sm review-item">

                        <div class="stack gap-1">

                            <div class="cluster gap-2">
                                <span class="text-mono text-muted">
                                    ${escapeHTML(project.id)}
                                </span>

                                ${RGMS.badgeHTML(project.status)}

                                <span class="tag">
                                    ${escapeHTML(tier.short || "ไม่ระบุระดับทุน")}
                                </span>
                            </div>

                            <div style="font-weight:600;">
                                ${escapeHTML(project.title || "ไม่ระบุชื่อโครงการ")}
                            </div>

                            <div class="text-sm text-muted">
                                ${escapeHTML(project.pi || "ไม่ระบุผู้วิจัย")}
                                · งบที่ขอ
                                ${escapeHTML(RGMS.fmtBaht(project.budgetReq))}
                            </div>

                        </div>

                        <div class="review-actions">

                            <a
                                class="btn btn-secondary btn-sm"
                                href="${detailURL}">
                                ดูเอกสาร
                            </a>

                            <button
                                type="button"
                                class="btn btn-ok btn-sm"
                                data-pass="${escapeHTML(id)}"
                                ${busyIds.has(id) ? "disabled" : ""}>
                                รับรอง → ส่งส่วนบริหาร
                            </button>

                            <button
                                type="button"
                                class="btn btn-secondary btn-sm"
                                data-return="${escapeHTML(id)}"
                                ${busyIds.has(id) ? "disabled" : ""}>
                                ส่งกลับแก้ไข
                            </button>

                        </div>
                    </article>
                `;
            }).join("");
        }


        // แสดงรายการที่ดำเนินการแล้ว
        if (visibleDone.length === 0) {
            var message = "ยังไม่มีรายการที่ดำเนินการแล้ว";

            if (selectedKPI === "passed") {
                message = "ยังไม่มีโครงการที่รับรองแล้ว";
            } else if (selectedKPI === "returned") {
                message = "ยังไม่มีโครงการที่ส่งกลับแก้ไข";
            }

            doneElement.innerHTML = emptyMessage(message);
        } else {
            doneElement.innerHTML = visibleDone.map(function (project) {
                return `
                    <div
                        class="between wrap gap-2 review-item"
                        style="padding:8px 0; border-bottom:1px solid var(--color-divider);">

                        <span class="text-sm">
                            <span class="text-mono text-muted">
                                ${escapeHTML(project.id)}
                            </span>

                            · ${escapeHTML(project.title || "ไม่ระบุชื่อโครงการ")}
                        </span>

                        ${endorsementLabel(getEndorsementStatus(project))}

                    </div>
                `;
            }).join("");
        }
    }


    // คลิกการ์ดสถิติเพื่อกรองและเลื่อนไปยังรายการ
    kpiElement.addEventListener("click", function (event) {
        var card = event.target.closest("[data-kpi]");

        if (!card) {
            return;
        }

        selectedKPI = card.getAttribute("data-kpi");

        render();

        var targetId = selectedKPI === "pending"
            ? "pending-section"
            : "done-section";

        var target = document.getElementById(targetId);

        if (target && !target.hidden) {
            target.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }
    });


    // รับรองหรือส่งกลับแก้ไข
    pendingElement.addEventListener("click", function (event) {
        var passButton = event.target.closest("[data-pass]");
        var returnButton = event.target.closest("[data-return]");


        // รับรองข้อเสนอ
        if (passButton) {
            var passId = passButton.getAttribute("data-pass");

            if (busyIds.has(passId)) {
                return;
            }

            if (!canEndorse(passId)) {
                RGMS.toast(
                    "โครงการนี้ไม่อยู่ในสถานะที่สามารถรับรองได้",
                    "accent"
                );
                render();
                return;
            }

            RGMS.modal({
                title: "ยืนยันการรับรองข้อเสนอ",

                body:
                    "<p>คุณต้องการรับรองข้อเสนอโครงการนี้ใช่หรือไม่?</p>" +
                    '<p class="text-sm text-muted" style="margin-top:8px;">' +
                    "โปรดตรวจสอบเอกสารและข้อมูลโครงการก่อนยืนยัน" +
                    "</p>",

                foot:
                    '<button class="btn btn-secondary btn-md" data-close>' +
                    "ยกเลิก</button>" +
                    '<button class="btn btn-ok btn-md" id="confirm-pass">' +
                    "ยืนยันการรับรอง</button>",

                onMount: function (back, close) {
                    var confirmButton =
                        back.querySelector("#confirm-pass");

                    confirmButton.addEventListener("click", function () {
                        if (busyIds.has(passId)) {
                            return;
                        }

                        if (!canEndorse(passId)) {
                            close();

                            RGMS.toast(
                                "สถานะโครงการเปลี่ยนไปแล้ว กรุณาตรวจสอบอีกครั้ง",
                                "accent"
                            );

                            render();
                            return;
                        }

                        busyIds.add(passId);
                        confirmButton.disabled = true;

                        try {
                            RGMS.setEndorse(passId, "passed");
                            close();

                            RGMS.toast(
                                "เปลี่ยนสถานะรับรองแล้ว (ระบบสาธิต)",
                                "ok"
                            );
                        } catch (error) {
                            console.error(error);

                            RGMS.toast(
                                "ดำเนินการไม่สำเร็จ กรุณาลองอีกครั้ง",
                                "accent"
                            );
                        } finally {
                            busyIds.delete(passId);
                            render();
                        }
                    });
                }
            });

            return;
        }


        // ส่งกลับแก้ไข
        if (returnButton) {
            var returnId = returnButton.getAttribute("data-return");

            if (busyIds.has(returnId)) {
                return;
            }

            if (!canEndorse(returnId)) {
                RGMS.toast(
                    "โครงการนี้ไม่อยู่ในสถานะที่สามารถส่งกลับได้",
                    "accent"
                );

                render();
                return;
            }

            RGMS.modal({
                title: "ส่งกลับให้นักวิจัยแก้ไข",

                body:
                    '<div class="field" style="margin:0;">' +
                        '<label class="field__label" for="endorsement-reason">' +
                            "เหตุผล / ข้อเสนอแนะให้แก้ไข (จำเป็น)" +
                        "</label>" +

                        '<textarea class="field__control" ' +
                            'id="endorsement-reason" rows="5" maxlength="1000" ' +
                            'placeholder="ระบุสิ่งที่ต้องแก้ไขอย่างชัดเจน">' +
                        "</textarea>" +

                        '<p class="text-sm text-muted" style="margin-top:8px;">' +
                            "กรอกอย่างน้อย 10 ตัวอักษร และไม่เกิน 1,000 ตัวอักษร" +
                        "</p>" +
                    "</div>",

                foot:
                    '<button class="btn btn-secondary btn-md" data-close>' +
                    "ยกเลิก</button>" +
                    '<button class="btn btn-primary btn-md" id="confirm-return">' +
                    "ส่งกลับแก้ไข</button>",

                onMount: function (back, close) {
                    var reasonInput =
                        back.querySelector("#endorsement-reason");

                    var confirmButton =
                        back.querySelector("#confirm-return");

                    confirmButton.addEventListener("click", function () {
                        var reason = reasonInput.value.trim();

                        if (reason.length < 10) {
                            RGMS.toast(
                                "กรุณาระบุเหตุผลอย่างน้อย 10 ตัวอักษร",
                                "accent"
                            );

                            reasonInput.focus();
                            return;
                        }

                        if (reason.length > 1000) {
                            RGMS.toast(
                                "เหตุผลต้องไม่เกิน 1,000 ตัวอักษร",
                                "accent"
                            );

                            reasonInput.focus();
                            return;
                        }

                        if (busyIds.has(returnId)) {
                            return;
                        }

                        if (!canEndorse(returnId)) {
                            close();

                            RGMS.toast(
                                "สถานะโครงการเปลี่ยนไปแล้ว กรุณาตรวจสอบอีกครั้ง",
                                "accent"
                            );

                            render();
                            return;
                        }

                        busyIds.add(returnId);
                        confirmButton.disabled = true;

                        try {
                            /*
                             * ฟังก์ชันเดิมรับเพียง id และ status
                             * เหตุผลจึงยังไม่ได้บันทึกจริง
                             * ต้องปรับ shared.js เพื่อจัดเก็บ reason
                             */
                            RGMS.setEndorse(returnId, "returned");
                            close();

                            RGMS.toast(
                                "เปลี่ยนสถานะเป็นส่งกลับแก้ไขแล้ว " +
                                "(เหตุผลยังไม่ได้บันทึกโดยฟังก์ชันเดิม)",
                                "accent"
                            );
                        } catch (error) {
                            console.error(error);

                            RGMS.toast(
                                "ดำเนินการไม่สำเร็จ กรุณาลองอีกครั้ง",
                                "accent"
                            );
                        } finally {
                            busyIds.delete(returnId);
                            render();
                        }
                    });
                }
            });
        }
    });


    // เริ่มต้นหน้า
    render();

})();
</script>

</body>
</html>
