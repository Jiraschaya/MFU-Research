<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โครงการของฉัน — RGMS ทุนวิจัย มฟล.</title>
<link rel="stylesheet" href="style.css">
<style>
  [hidden] { display:none !important; }
  .notice--wait { border-left-color: var(--st-wait); background: var(--st-wait-tint); }
  .call-card { border: 1px solid var(--color-primary); background: var(--color-primary-tint); }
  .call-card .call-meta { display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2); }
  .proj-title { font-weight: 600; color: var(--color-text-strong); line-height: 1.4; }

  /* ป้ายสถานะ: ใช้ชุดเดียวกับหน้าเลขานุการ/ประธาน (จุด ขนาด ฟอนต์ เท่ากันทุกป้าย) */
  .badge.chip{display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;min-height:32px;padding:0 14px;font-size:14px;line-height:1.2;font-weight:600;white-space:nowrap}
  .badge.chip::before,.badge.chip::after{content:none!important;display:none!important}
  .badge.chip--review{background:#ede9fe!important;border-color:#ddd6fe!important;color:#5b21b6!important}
  .badge.chip--active{background:#e0f2fe!important;border-color:#bae6fd!important;color:#075985!important}
  .chip__dot{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:none!important;animation:none!important}
  .badge, .badge::before, .badge::after, .table .badge *{animation:none!important}

  .notif{position:fixed;top:12px;right:16px;z-index:1000}
  .notif__btn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid #e2e8f0;background:#fff;box-shadow:0 4px 12px rgba(15,23,42,.15);cursor:pointer;font-size:20px;line-height:1}
  .notif__btn:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
  .notif__badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#991b1b;color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
  .notif__panel{position:absolute;top:52px;right:0;width:min(360px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.2)}
  .notif__head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #e2e8f0;font-weight:600}
  .notif__head button{border:0;background:none;color:#2563eb;cursor:pointer;font:inherit;font-size:13px}
  .notif__item{padding:10px 14px;border-bottom:1px solid #f1f5f9;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
  .notif__item.unread{background:#fffaf0}
  .notif__time{display:block;font-size:12px;color:#64748b}
  .notif__empty{padding:20px;text-align:center;color:#64748b;font-size:14px}
  .notif__tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:4px}
  .notif__comment{margin-top:6px;padding:8px 10px;border-left:3px solid #d97706;background:#fffbeb;border-radius:0 8px 8px 0;font-size:13px;line-height:1.55;color:#78350f}
  .notif__comment--reject{border-left-color:#991b1b;background:#fef2f2;color:#7f1d1d}
  .fab-reset{position:fixed;right:24px;bottom:24px;z-index:900;width:52px;height:52px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#96181F 0%,#851419 100%);border:1px solid #680E12;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(133,20,25,.35);transition:transform .2s,box-shadow .2s}
  .fab-reset:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(133,20,25,.4);color:#fff}
  .fab-reset svg{width:24px;height:24px;transition:transform .5s}
  .fab-reset:hover svg,.fab-reset.spin svg{transform:rotate(360deg)}
  .fab-reset:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
  .badge.chip--revise{background:#fef3c7!important;border-color:#fde68a!important;color:#92400e!important}
  .row-note--reject{border-left-color:#991b1b!important;background:#fef2f2!important;color:#7f1d1d!important}
  .row-note{margin-top:6px;padding:8px 12px;border-left:3px solid #d97706;background:#fffbeb;border-radius:0 8px 8px 0;font-size:13px;line-height:1.6;color:#78350f;overflow-wrap:anywhere}

  /* การ์ดสรุป: ใช้ชุดเดียวกับหน้าประธาน/คณบดี กดเพื่อกรองรายการ */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;width:100%}
  .kpi-card{appearance:none;-webkit-appearance:none;position:relative;display:flex;flex-direction:column;justify-content:center;width:100%;min-width:0;min-height:125px;padding:24px 28px;overflow:hidden;text-align:left;font:inherit;color:#0f172a;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 4px 12px rgba(15,23,42,.06);transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
  .kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#991b1b,#c79a24)}
  button.kpi-card{cursor:pointer}
  button.kpi-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(15,23,42,.12)}
  .kpi-card:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
  .kpi-card[aria-pressed="true"]{background:#fffaf0;box-shadow:0 0 0 2px rgba(183,138,34,.25),0 4px 12px rgba(15,23,42,.06)}
  .kpi-card__value{display:block;margin-bottom:6px;font-size:36px;line-height:1.15;font-weight:700}
  .kpi-card__label{display:block;font-size:15px;line-height:1.45;color:#334155}
  .filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  @media (max-width:1000px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:560px){.kpi-grid{grid-template-columns:1fr}.kpi-card{min-height:110px;padding:20px}}
  .returned-list{margin:6px 0 0;padding-left:18px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="app-nav-root"></div>

<div class="notif" id="notif">
  <button type="button" class="notif__btn" id="notif-btn" aria-label="การแจ้งเตือน" aria-expanded="false" aria-controls="notif-panel">🔔<span class="notif__badge" id="notif-badge" hidden>0</span></button>
  <div class="notif__panel" id="notif-panel" hidden>
    <div class="notif__head"><span>การแจ้งเตือน</span><span><button type="button" id="notif-read">อ่านทั้งหมด</button> <button type="button" id="notif-clear">ล้าง</button></span></div>
    <div id="notif-list" aria-live="polite"></div>
  </div>
</div>
<main class="section">
  <div class="container stack gap-5">

    <div class="page-head">
      <div class="between wrap">
        <div class="stack gap-1">
          <h1 class="text-headline">โครงการของฉัน</h1>
          <p class="text-muted" id="greet"></p>
        </div>
        <a class="btn btn-primary btn-md" href="proposal-new.html">+ ยื่นข้อเสนอใหม่</a>
      </div>
    </div>

    <div class="notice notice--wait" id="revise-note" role="status" hidden>
      <span class="notice__title" id="revise-title"></span>
      <span class="notice__body">เปิดโครงการเพื่อดูเงื่อนไขตามมติ แล้วส่งฉบับแก้ไขกลับ</span>
    </div>

    <div class="notice notice--wait" id="profile-warn" hidden>
      <span class="notice__title">ยังไม่ได้บันทึกโปรไฟล์นักวิจัย</span>
      <span class="notice__body">ข้อมูลหัวหน้าโครงการและประวัติ (ส่วน ข) ในข้อเสนอจะดึงจากโปรไฟล์ — <a href="researcher-profile.html">กรอกโปรไฟล์ก่อนยื่น</a></span>
    </div>

    <div class="stack gap-3" id="open-calls"></div>

    <div class="kpi-grid" id="kpis" aria-label="สรุปสถานะโครงการ กดการ์ดเพื่อกรองรายการ กดซ้ำเพื่อกลับมุมมองเดิม"></div>

    <div class="filter-bar" id="filter-bar" hidden>
      <span class="text-sm text-muted" id="filter-label"></span>
    </div>

    <div class="card card--pad-sm" id="projects-card">
      <div class="card__header"><h2 class="text-subhead">รายการโครงการ</h2></div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th scope="col">รหัส</th><th scope="col">ชื่อโครงการ</th><th scope="col">รอบทุน</th>
            <th scope="col" class="right">งบที่ขอ</th><th scope="col">สถานะ</th><th scope="col"><span class="sr-only">การดำเนินการ</span></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<button type="button" class="fab-reset" id="fab-reset" aria-label="รีเซ็ต กลับจุดเดิม" title="รีเซ็ต / กลับจุดเดิม">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
</button>

<script src="shared.js"></script>
<script>
  if (!window.RGMS) {
    document.getElementById("app-nav-root").innerHTML =
      '<div style="padding:16px;background:#fdecea;color:#b71c1c">โหลด shared.js ไม่สำเร็จ — ตรวจว่าไฟล์อยู่โฟลเดอร์เดียวกับหน้านี้</div>';
    throw new Error("shared.js not loaded");
  }

  RGMS.renderAppNav("researcher-home");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function $(id) { return document.getElementById(id); }
  function detailHref(id) { return "project-detail.html?id=" + encodeURIComponent(id); }

  /* ---------- ป้ายสถานะแบบเดียวกับหน้าเลขานุการ ---------- */
  var STATUS_NAME = {
    draft: "ฉบับร่าง", submitted: "ยื่นข้อเสนอโครงการแล้ว", endorse: "รอรับรองสำนักวิชา", screening: "ตรวจสอบเบื้องต้น",
    revise: "ให้ปรับแก้ตามมติ", review: "อยู่ระหว่างพิจารณา", committee: "เสนอคณะกรรมการ", approved: "อนุมัติแล้ว",
    rejected: "ไม่อนุมัติ", announced: "ประกาศผลแล้ว", ongoing: "กำลังดำเนินโครงการ", progress: "รายงานความก้าวหน้า",
    financial: "รายงานการเงิน", final: "รายงานฉบับสมบูรณ์", closed: "ปิดโครงการ"
  };
  function chip(cls, text) {
    return '<span class="badge ' + (cls || "") + ' chip"><span class="chip__dot" aria-hidden="true"></span>' + esc(text) + "</span>";
  }
  function statusChip(status, label) {
    var box = document.createElement("div");
    box.innerHTML = RGMS.badgeHTML(status);
    var b = box.querySelector(".badge") || box.firstElementChild;
    if (!b) return chip("", STATUS_NAME[status] || status);
    var cls = (b.className || "").split(/\s+/).filter(function (c) { return /^badge[-_]/.test(c); }).join(" ");
    var text = (b.textContent || "").replace(/\s+/g, " ").trim();
    if (STATUS_NAME[status] && (!text || /^[A-Za-z][A-Za-z _-]*$/.test(text))) text = STATUS_NAME[status];  // รหัสอังกฤษ → ไทย
    if (status === "review" || status === "committee") cls = "chip--review";
    else if (["ongoing", "progress", "financial", "final"].indexOf(status) >= 0) cls = "chip--active";
    else if (status === "revise") cls = "chip--revise";
    return chip(cls, label || text);
  }

  /* ---------- วันที่ ---------- */
  var TH_M = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  function parseDate(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
  function fmtDate(s) { var p = parseDate(s); return p ? p.d + " " + TH_M[p.m - 1] + " " + p.y : (s || "—"); }
  function daysLeft(s) {
    var p = parseDate(s); if (!p) return null;
    var ce = p.y > 2400 ? p.y - 543 : p.y;
    return Math.ceil((new Date(ce, p.m - 1, p.d, 23, 59, 59) - new Date()) / 86400000);
  }

  var me = (RGMS.currentRole() || {}).name || "";
  $("greet").textContent = "สวัสดี " + (me || "นักวิจัย") + " — โครงการที่คุณเป็นหัวหน้าโครงการ";
  if (!RGMS.profileSaved()) $("profile-warn").hidden = false;

  var KEY_CHAIR = "rgms_chair_state_v1";   // ต้องประกาศก่อนสร้าง mine ไม่งั้น chairState() อ่านคีย์ผิดและไม่เห็นโครงการที่ถูกส่งกลับ
  var mine = (RGMS.PROJECTS || [])
    .filter(function (p) { return me && p.pi === me; })
    .map(function (p, i) {
      var l = chairState()[String(p.id)], back = !!(l && l.status === "returned");
      return { p: p, l: (back || (l && l.status === "rejected")) ? l : null, st: back ? "revise" : (l && l.status === "rejected" ? "rejected" : RGMS.effectiveStatus(p)), chair: back, i: i };   // ประธานส่งกลับ → สถานะ "รอแก้ไข"
    })
    .sort(function (a, b) { return ((b.st === "revise") - (a.st === "revise")) || (a.i - b.i); });

  /* ---------- ถูกส่งกลับจากประธาน/คณบดี ---------- */
  function chairState() {
    try { return JSON.parse(localStorage.getItem(KEY_CHAIR) || "{}") || {}; } catch (e) { return {}; }
  }
  function editHref(id) { return "proposal-new.html?edit=" + encodeURIComponent(id); }
  function myProjects() { return (RGMS.PROJECTS || []).filter(function (p) { return me && p.pi === me; }); }
  window.addEventListener("storage", function () { notifyTick(); });
  window.addEventListener("focus", function () { notifyTick(); });
  window.addEventListener("pageshow", function () { notifyTick(); });
  setInterval(function () { notifyTick(); }, 3000);

  var reviseN = mine.filter(function (x) { return x.st === "revise" && !x.chair; }).length;
  if (reviseN) {
    $("revise-title").textContent = "มี " + reviseN + " โครงการที่ต้องปรับแก้ตามมติ";
    $("revise-note").hidden = false;
  }

  /* ---------- ทุนที่เปิดรับสมัคร ---------- */
  var calls = RGMS.CALLS || [];
  var openCalls = calls.filter(function (c) { return RGMS.callStatus(c) === "open"; });
  var ocEl = $("open-calls");
  if (openCalls.length) {
    var tierChips = Object.keys(RGMS.TIERS || {}).map(function (k) {
      var t = RGMS.TIERS[k];
      return '<span class="tag">' + esc(t.short) + ' ≤ ' + esc(RGMS.fmtMoney(t.cap)) + '</span>';
    }).join(" ");
    ocEl.innerHTML = '<span class="text-overline">ทุนที่เปิดรับสมัคร</span>' +
      '<div class="grid grid-auto">' + openCalls.map(function (c) {
        var n = daysLeft(c.close), left = "";
        if (n != null && n >= 0) {
          left = '<span class="badge ' + (n <= 7 ? "badge-wait" : "badge-draft") + '">' +
            (n === 0 ? "ปิดรับวันนี้" : "ปิดรับอีก " + n + " วัน") + '</span>';
        }
        return '<div class="card stack gap-2 call-card">' +
          '<div class="between wrap gap-2"><span class="text-subhead">' + esc(c.title) + '</span><span class="badge badge-ok">เปิดรับ</span></div>' +
          '<div class="call-meta text-sm text-muted"><span>รับข้อเสนอ ' + esc(fmtDate(c.open)) + ' – ' + esc(fmtDate(c.close)) + '</span>' + left + '</div>' +
          '<div class="cluster gap-1 wrap">' + tierChips + '</div>' +
          '<a class="btn btn-primary btn-md" href="proposal-new.html" style="align-self:flex-start; margin-top:4px;">ยื่นข้อเสนอโครงการ →</a>' +
        '</div>';
      }).join("") + '</div>';
  } else {
    var up = calls.filter(function (c) { return RGMS.callStatus(c) === "upcoming"; })[0];
    ocEl.innerHTML = '<div class="notice notice--wait"><span class="notice__title">ขณะนี้ยังไม่มีรอบที่เปิดรับสมัคร</span>' +
      '<span class="notice__body">' + (up ? ('รอบถัดไป: ' + esc(up.title) + ' · เปิดรับ ' + esc(fmtDate(up.open)) + ' ถึง ' + esc(fmtDate(up.close))) : 'โปรดรอประกาศเปิดรับจากส่วนบริหารงานวิจัย') + '</span></div>';
  }

  /* ---------- การ์ดสรุป (กดเพื่อกรองตารางโครงการ) ---------- */
  var REVIEWING = ["submitted", "endorse", "screening", "review", "committee", "approved"];   // ไม่รวม revise (แยกเป็นการ์ด "เอกสารรอแก้ไข")
  var RUNNING   = ["ongoing", "progress", "final", "financial", "announced"];
  var GROUPS = { review: REVIEWING, revise: ["revise"], running: RUNNING };
  var FILTER_NAME = { review: "อยู่ระหว่างพิจารณา", revise: "เอกสารรอแก้ไข", running: "กำลังดำเนินการ" };
  var selectedKPI = "all", savedScroll = 0;

  function countOf(k) { return mine.filter(function (x) { return GROUPS[k].indexOf(x.st) >= 0; }).length; }
  var totalBudget = mine.reduce(function (s, x) { return s + (Number(x.p.budgetReq) || 0); }, 0);

  function renderKPIs() {
    var cards = [
      { id: "review",  label: "อยู่ระหว่างพิจารณา", value: countOf("review") },
      { id: "revise",  label: "เอกสารรอแก้ไข",     value: countOf("revise") },
      { id: "running", label: "กำลังดำเนินการ",     value: countOf("running") }
    ];
    $("kpis").innerHTML = cards.map(function (c) {
      return '<button type="button" class="kpi-card' + (c.cls || "") + '" data-kpi="' + c.id + '" aria-pressed="' + (selectedKPI === c.id) + '" aria-controls="projects-card">' +
        '<span class="kpi-card__value">' + esc(c.value) + '</span>' +
        '<span class="kpi-card__label">' + esc(c.label) + ' · โครงการ</span></button>';
    }).join("") +
    '<div class="kpi-card"><span class="kpi-card__value">' + esc(RGMS.fmtMoney(totalBudget)) + '</span>' +
    '<span class="kpi-card__label">งบที่ขอรวม · บาท</span></div>';
  }

  /* ---------- ตารางโครงการ ---------- */
  function actionFor(x) {
    var label, cls;
    if (x.chair)                 { label = "แก้ไขเอกสาร"; cls = "btn-primary"; }
    else if (x.st === "revise")  { label = "ปรับแก้ตามมติ";     cls = "btn-primary"; }
    else if (x.st === "ongoing") { label = "ส่งรายงานก้าวหน้า"; cls = "btn-secondary"; }
    else if (x.st === "final")   { label = "ดูสถานะการเงิน";   cls = "btn-secondary"; }
    else                         { label = "รายละเอียด →";      cls = "btn-ghost"; }
    return '<a class="btn ' + cls + ' btn-sm" href="' + esc(x.chair ? editHref(x.p.id) : detailHref(x.p.id)) + '" aria-label="' + esc(label + " โครงการ " + x.p.id) + '">' + esc(label) + '</a>';
  }
  function reviseNote(x) {
    if (!x.l) return "";
    var rej = x.l.status === "rejected", parts = [];
    if (!rej && x.l.sections && x.l.sections.length) parts.push("<b>ส่วนที่ต้องแก้ไข:</b> " + esc(x.l.sections.join(", ")));
    parts.push("<b>" + (rej ? "เหตุผลที่ไม่รับรอง" : "ความเห็นจากประธาน/คณบดี") + ":</b> " + (x.l.reason ? esc(x.l.reason) : '<span class="text-muted">ไม่ได้ระบุเหตุผล</span>'));
    if (x.l.at) parts.push('<span class="text-muted">เมื่อ ' + esc(new Date(x.l.at).toLocaleString("th-TH")) + "</span>");
    return '<div class="row-note' + (rej ? ' row-note--reject' : '') + '">' + parts.join("<br>") + "</div>";
  }

  var rowsEl = $("rows");
  function renderRows() {
    var list = selectedKPI === "all" ? mine : mine.filter(function (x) { return GROUPS[selectedKPI].indexOf(x.st) >= 0; });
    if (!mine.length) {
      rowsEl.innerHTML = '<tr><td colspan="6" class="text-muted" style="padding:24px; text-align:center;">ยังไม่มีโครงการที่คุณเป็นหัวหน้าโครงการ — เริ่มต้นด้วย <a href="proposal-new.html">ยื่นข้อเสนอใหม่</a></td></tr>';
    } else if (!list.length) {
      rowsEl.innerHTML = '<tr><td colspan="6" class="text-muted" style="padding:24px; text-align:center;">ยังไม่มีโครงการในสถานะ “' + esc(FILTER_NAME[selectedKPI]) + '”</td></tr>';
    } else {
      rowsEl.innerHTML = list.map(function (x) {
        var p = x.p;
        return '<tr class="is-clickable" data-id="' + esc(p.id) + '">' +
          '<td class="num">' + esc(p.id) + '</td>' +
          '<td><div class="proj-title">' + esc(p.title) + '</div>' + (p.duration ? '<div class="text-sm text-muted">ระยะเวลา ' + esc(p.duration) + '</div>' : '') + reviseNote(x) + '</td>' +
          '<td><span class="pill-round">' + esc(p.round) + '</span></td>' +
          '<td class="right num">' + esc(RGMS.fmtMoney(Number(p.budgetReq) || 0)) + '</td>' +
          '<td>' + statusChip(x.st, x.chair ? "รอแก้ไขเอกสาร" : null) + '</td>' +
          '<td class="right">' + actionFor(x) + '</td>' +
        '</tr>';
      }).join("");
    }
    $("filter-bar").hidden = selectedKPI === "all";
    $("filter-label").textContent = selectedKPI === "all" ? "" : "กำลังกรอง: " + FILTER_NAME[selectedKPI] + " (" + list.length + " โครงการ) — กดการ์ดเดิมอีกครั้งเพื่อแสดงทั้งหมด";
  }
  renderKPIs();
  renderRows();

  $("kpis").addEventListener("click", function (e) {
    var card = e.target.closest("[data-kpi]");
    if (!card) return;
    var next = card.getAttribute("data-kpi");
    if (next === selectedKPI) {                      // กดซ้ำ = ยกเลิกตัวกรอง กลับจุดเดิม
      selectedKPI = "all"; renderKPIs(); renderRows();
      window.scrollTo({ top: savedScroll, behavior: "smooth" });
      return;
    }
    if (selectedKPI === "all") savedScroll = window.pageYOffset;
    selectedKPI = next; renderKPIs(); renderRows();
    $("projects-card").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  rowsEl.addEventListener("click", function (e) {
    if (e.target.closest("a, button")) return;
    var tr = e.target.closest("[data-id]");
    if (tr) window.location.href = detailHref(tr.getAttribute("data-id"));
  });

  /* ---------- แจ้งเตือน: เฉพาะผลการพิจารณาจากประธาน/คณบดี (รับรอง / ไม่รับรอง / ส่งกลับแก้ไข) ---------- */
  var escapeHTML = esc;
  function load(key, fallback) { try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
  function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
  var KEY_NOTIF = "rgms_res_notif_v2:" + me, KEY_LAST_C = "rgms_res_chair_last_v2:" + me;   // แยกตามนักวิจัยแต่ละคน
  var notifs = load(KEY_NOTIF, []);
  var notifBtn = $("notif-btn"), notifPanel = $("notif-panel");

  /* บันทึกเหตุการณ์ร่วม (ใช้ตอนรีเซ็ต เพื่อให้หน้าประธานเห็น) */
  var KEY_EVENTS = "rgms_events_v1";
  function logEvent(e) {
      var list = load(KEY_EVENTS, []);
      e.id = Date.now() + "-" + Math.random().toString(36).slice(2, 7);
      e.at = Date.now();
      list.push(e);
      save(KEY_EVENTS, list.slice(-200));
  }

  var DECISION = {
    passed:   { label: "รับรองแล้ว",     fg: "#065f46", bg: "#d1fae5", msg: "ประธาน/คณบดีรับรองโครงการแล้ว · ส่งต่อส่วนบริหารงานวิจัย" },
    rejected: { label: "ไม่รับรอง",      fg: "#991b1b", bg: "#fee2e2", msg: "ประธาน/คณบดีไม่รับรองโครงการ" },
    returned: { label: "ส่งกลับแก้ไข",   fg: "#92400e", bg: "#fef3c7", msg: "ประธาน/คณบดีส่งโครงการกลับให้แก้ไข" }
  };
  function addNotif(p, l) {
      var id = String(p.id) + "@" + (l.at || "") + ":" + l.status;
      if (notifs.some(function (n) { return n.id === id; })) return;
      notifs.unshift({ id: id, kind: l.status, pid: String(p.id), title: p.title || "", reason: l.reason || "", sections: l.sections || [], at: l.at || Date.now(), read: false });
      notifs = notifs.slice(0, 40);
      save(KEY_NOTIF, notifs);
      renderNotifs();
  }
  function renderNotifs() {
      var unread = notifs.filter(function (n) { return !n.read; }).length;
      var badge = $("notif-badge");
      badge.textContent = unread > 99 ? "99+" : unread;
      badge.hidden = unread === 0;
      $("notif-list").innerHTML = notifs.length === 0
          ? '<div class="notif__empty">ยังไม่มีผลการพิจารณาจากประธาน/คณบดี</div>'
          : notifs.map(function (n) {
              var d = DECISION[n.kind] || DECISION.returned;
              var t = new Date(n.at).toLocaleString("th-TH", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
              var comment = "";
              if (n.kind !== "passed") {
                  comment = '<div class="notif__comment' + (n.kind === "rejected" ? " notif__comment--reject" : "") + '">' +
                      (n.kind === "returned" && n.sections.length ? "<b>ส่วนที่ต้องแก้ไข:</b> " + escapeHTML(n.sections.join(", ")) + "<br>" : "") +
                      "<b>ความเห็นจากประธาน/คณบดี:</b> " + (n.reason ? escapeHTML(n.reason) : "ไม่ได้ระบุเหตุผล") + "</div>";
              }
              return '<div class="notif__item' + (n.read ? "" : " unread") + '">' +
                  '<span class="notif__tag" style="color:' + d.fg + ";background:" + d.bg + ';">' + escapeHTML(d.label) + "</span><br>" +
                  "<b>" + escapeHTML(n.pid) + "</b> · " + escapeHTML(n.title) + "<br>" + escapeHTML(d.msg) + comment +
                  '<span class="notif__time">' + escapeHTML(t) + "</span></div>";
          }).join("");
  }
  function markRead() { notifs.forEach(function (n) { n.read = true; }); save(KEY_NOTIF, notifs); }

  function setPanel(open) {
    notifPanel.hidden = !open;
    notifBtn.setAttribute("aria-expanded", String(open));
    if (open) { markRead(); renderNotifs(); }
  }
  notifBtn.addEventListener("click", function (e) { e.stopPropagation(); setPanel(notifPanel.hidden); });
  $("notif-read").addEventListener("click", function () { markRead(); renderNotifs(); });
  $("notif-clear").addEventListener("click", function () { notifs = []; save(KEY_NOTIF, notifs); renderNotifs(); });
  document.addEventListener("click", function (e) { if (!notifPanel.hidden && !$("notif").contains(e.target)) setPanel(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !notifPanel.hidden) { setPanel(false); notifBtn.focus(); } });

  function sigNow() {
    var cs = chairState();
    return myProjects().map(function (p) { var l = cs[String(p.id)]; return p.id + ":" + (l ? l.status + ":" + (l.at || "") : ""); }).join("|");
  }
  var loadSig = sigNow();

  function notifyTick() {
    var cs = chairState(), last = load(KEY_LAST_C, null), first = (last === null), map = {};
    myProjects().forEach(function (p) {
      var id = String(p.id), l = cs[id], key = (l && DECISION[l.status]) ? l.status + ":" + (l.at || "") : "";
      map[id] = key;
      if (key && (first || (last[id] || "") !== key)) addNotif(p, l);   // เปิดครั้งแรกจะดึงผลที่ประธานตัดสินไว้แล้วมาแสดงด้วย
    });
    save(KEY_LAST_C, map);
    if (sigNow() !== loadSig) location.reload();   // ผลจากประธานเปลี่ยน → วาดตารางและสถานะใหม่
  }
  renderNotifs();
  notifyTick();

  /* ---------- ปุ่มรีเซ็ต: ล้างผลตัดสินของประธานในโครงการของฉัน ให้กลับไปรอรับรอง ---------- */
  var fab = $("fab-reset");
  fab.addEventListener("click", function () {
    fab.classList.remove("spin"); void fab.offsetWidth; fab.classList.add("spin");
    setTimeout(function () { fab.classList.remove("spin"); }, 600);
    setPanel(false);
    var cs = chairState();
    var decided = myProjects().filter(function (p) { var l = cs[String(p.id)]; return l && (l.status === "returned" || l.status === "rejected"); });
    if (!decided.length) {
      window.scrollTo({ top: 0, behavior: "smooth" });
      RGMS.toast("ไม่มีโครงการที่ต้องรีเซ็ต", "accent");
      return;
    }
    RGMS.modal({
      title: "รีเซ็ตผลการตัดสิน",
      body: "<p>ย้ายโครงการของคุณ <b>" + decided.length + "</b> รายการ ที่ประธาน/คณบดีส่งกลับหรือไม่รับรอง กลับไปอยู่ในรายการรอรับรอง?</p>" +
        '<p class="text-sm text-muted" style="margin-top:8px;">เหตุผลและส่วนที่ต้องแก้ไขของรายการเหล่านี้จะถูกล้าง</p>',
      foot: '<button class="btn btn-secondary btn-md" data-close>ยกเลิก</button><button class="btn btn-primary btn-md" id="confirm-reset">ยืนยันรีเซ็ต</button>',
      onMount: function (back, close) {
        back.querySelector("#confirm-reset").addEventListener("click", function () {
          var st = chairState();
          decided.forEach(function (p) {
            st[String(p.id)] = { status: "pending", reason: "", sections: [], at: Date.now(), restored: true };
            logEvent({ src: "researcher", kind: "reset", pid: String(p.id), text: "นักวิจัยรีเซ็ตโครงการ " + p.id + " กลับไปรอรับรอง" });
          });
          save(KEY_CHAIR, st);
          close();
          location.reload();
        });
      }
    });
  });
</script>
</body>
</html>
