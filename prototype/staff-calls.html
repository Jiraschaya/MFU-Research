<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เปิดรับทุน / รอบทุน — RGMS ทุนวิจัย มฟล.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app-nav-root"></div>
<main class="section">
  <div class="container stack gap-5">

    <div class="page-head">
      <h1 class="text-headline">เปิดรับทุน / รอบทุน</h1>
      <p class="text-muted">เจ้าหน้าที่เปิด/ปิดรอบการรับข้อเสนอแต่ละปีงบ กำหนดช่วงเวลายื่นและเพดานงบ — ผู้ยื่นจะยื่นข้อเสนอได้เฉพาะรอบที่สถานะ "เปิดรับ" ภายในกำหนด (FR-01/02/03)</p>
    </div>

    <div class="between wrap" style="gap:12px;">
      <div id="open-note"></div>
      <button class="btn btn-primary btn-md" id="new-call">+ สร้างรอบทุนใหม่</button>
    </div>

    <div class="stack gap-4" id="cards"></div>

  </div>
</main>

<script src="shared.js"></script>
<script>
  RGMS.renderAppNav("staff-calls");
  var st = { open: ["เปิดรับ", "badge-ok"], closed_recent: ["ปิดรับล่าสุด", "badge-info"], closed: ["ปิดรับแล้ว", "badge-draft"], upcoming: ["กำลังจะเปิด", "badge-wait"] };

  function render() {
    var oc = RGMS.openCall();
    document.getElementById("open-note").innerHTML = oc
      ? '<span class="text-sm">รอบที่เปิดรับขณะนี้: <b>' + oc.title + '</b> · ปิดรับ <span class="num">' + oc.close + '</span></span>'
      : '<span class="text-sm text-accent" style="font-weight:600;">ขณะนี้ไม่มีรอบที่เปิดรับ — ผู้ยื่นยังยื่นข้อเสนอไม่ได้</span>';

    document.getElementById("cards").innerHTML = RGMS.CALLS.map(function (c) {
      var cs = RGMS.callStatus(c); var s = st[cs] || ["-", "badge-draft"];
      var isOpen = cs === "open";
      var toggle = isOpen
        ? '<button class="btn btn-secondary btn-md" data-close-call="' + c.id + '">ปิดรับ</button>'
        : '<button class="btn btn-ok btn-md" data-open-call="' + c.id + '">เปิดรับ</button>';
      return '<div class="card stack gap-3">' +
        '<div class="between wrap"><div class="stack gap-1">' +
          '<div class="cluster gap-2"><span class="text-title">' + c.title + '</span><span class="badge ' + s[1] + '">' + s[0] + '</span></div>' +
          '<div class="text-sm text-muted">ปีงบ ' + c.fiscalYear + ' · รับข้อเสนอ ' + c.open + ' – ' + c.close + '</div></div>' +
          '<div class="pill-round">ยื่นแล้ว ' + c.submissions + '</div></div>' +
        '<div class="grid grid-3">' +
          '<div class="stack gap-1"><span class="text-sm text-muted">ช่วงเปิดรับ</span><span style="font-weight:600;" class="num">' + c.open + ' – ' + c.close + '</span></div>' +
          '<div class="stack gap-1"><span class="text-sm text-muted">เพดานงบสูงสุด</span><span style="font-weight:600;" class="num">' + RGMS.fmtBaht(c.cap) + '</span></div>' +
          '<div class="stack gap-1"><span class="text-sm text-muted">ข้อเสนอที่ยื่น</span><span style="font-weight:600;" class="num">' + c.submissions + ' โครงการ</span></div>' +
        '</div>' +
        '<div class="cluster gap-2">' + toggle +
          '<button class="btn btn-ghost btn-md" data-edit="' + c.id + '">แก้ไขกำหนดการ/เพดาน</button></div>' +
      '</div>';
    }).join("");
  }

  document.getElementById("cards").addEventListener("click", function (e) {
    var o = e.target.closest("[data-open-call]"), c = e.target.closest("[data-close-call]"), ed = e.target.closest("[data-edit]");
    if (o) { RGMS.setCallStatus(o.getAttribute("data-open-call"), "open"); RGMS.toast("เปิดรับข้อเสนอรอบนี้แล้ว — ผู้ยื่นยื่นได้ทันที", "ok"); render(); }
    else if (c) { RGMS.setCallStatus(c.getAttribute("data-close-call"), "closed"); RGMS.toast("ปิดรับข้อเสนอรอบนี้แล้ว — ระบบล็อกการยื่น", "accent"); render(); }
    else if (ed) { RGMS.toast("เปิดฟอร์มแก้ไขกำหนดการ/เพดานงบ (สาธิต)", "accent"); }
  });

  document.getElementById("new-call").addEventListener("click", function () {
    RGMS.modal({
      title: "สร้างรอบทุนใหม่",
      body: '<div class="grid gap-3">' +
        '<div class="field" style="margin:0;"><label class="field__label">ปีงบประมาณ</label><input class="field__control" value="2570"></div>' +
        '<div class="grid grid-2"><div class="field" style="margin:0;"><label class="field__label">วันเปิดรับ</label><input class="field__control" value="2569-10-01"></div>' +
        '<div class="field" style="margin:0;"><label class="field__label">วันปิดรับ</label><input class="field__control" value="2569-11-30"></div></div>' +
        '<div class="field" style="margin:0;"><label class="field__label">เพดานงบสูงสุด (บาท)</label><input class="field__control" value="300000"></div>' +
        '<p class="text-sm text-muted" style="margin:0;">เพดานจริงแยกตามประเภททุน: นักวิจัยใหม่ 100,000 · พัฒนา 200,000 · ยุทธศาสตร์/ต่อยอด 300,000</p></div>',
      foot: '<button class="btn btn-secondary btn-md" data-close>ยกเลิก</button><button class="btn btn-primary btn-md" data-close id="mk">สร้างรอบ (สาธิต)</button>',
      onMount: function (back) { back.querySelector("#mk").addEventListener("click", function () { RGMS.toast("สร้างรอบทุนใหม่แล้ว — กด 'เปิดรับ' เพื่อเริ่มรับข้อเสนอ (สาธิต)", "ok"); }); }
    });
  });

  render();
</script>
</body>
</html>
