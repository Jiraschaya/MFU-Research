<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>คอนโซลตรวจประเมิน MFU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ===== Design plan =====
   Layout: sticky top bar + left icon-nav sidebar (collapses to a horizontal
   scroll row on phone width); main area switches between a searchable
   proposal queue (stat tiles + cards) and a two-column dual-track review
   console with per-track claim, comment, approve/return, and a lock
   overlay once a track is approved.
   Color:  --red (brand/primary), --red-dark (pressed), --ink (text),
           --paper (light grey app background), --surface (white cards),
           --line (borders). Semantic status colors (success/warn/danger/
           progress) are defined separately below.
   Type:   Sarabun for display + body (the standard face on Thai academic
           and government systems), IBM Plex Mono for money and timestamps
           so columns of digits line up.
*/
:root{
  --red:#d12329; --red-dark:#c51f26; --red-bg:#fbe9ea; --gold:#b8892f; --gold-soft:#ba9943;
  --ink:#201e23; --ink-soft:#6b6e76; --paper:#f8f8f7; --surface:#ffffff;
  --line:#efeeed; --line-soft:#f5f4f3;
  --success:#2f7d4f; --success-bg:#e4f3e9;
  --warn:#a6660b; --warn-bg:#fbeed8;
  --danger:#b3261e; --danger-bg:#fbe6e4;
  --progress:#3b5e8a; --progress-bg:#e7edf5;
  --locked:#847a6d; --locked-bg:#efece4;
  --focus:#1c63c9;
  color-scheme: light;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Sarabun',system-ui,sans-serif; font-size:15px; line-height:1.55;
}
h1,h2,h3{font-family:'Sarabun',sans-serif; font-weight:700; margin:0; text-wrap:balance}
button{font-family:inherit; font-size:inherit}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums}

.shell{display:flex; flex-direction:column; min-height:100%}

/* ---- top bar ---- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:12px 20px; background:var(--red); color:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.08);
}
.topbar-brand{display:flex; align-items:center; gap:10px; min-width:0}
.logo{
  width:38px; height:38px; border-radius:50%; background:#fff; color:var(--red);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:17px;
  flex-shrink:0;
}
.topbar-text{min-width:0}
.topbar-text b{display:block; font-size:15px; letter-spacing:.2px}
.topbar-text span{display:block; font-size:12px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar-right{display:flex; align-items:center; gap:14px; flex-shrink:0}
.bell{position:relative; width:22px; height:22px; opacity:.95}
.bell::after{content:"";position:absolute; top:-1px; right:-1px; width:8px; height:8px; border-radius:50%; background:#fff; border:1.5px solid var(--red)}
.user{display:flex; align-items:center; gap:9px}
.avatar{
  width:34px; height:34px; border-radius:50%; background:#fff2; color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px;
  border:1px solid #fff5;
}
.user-meta{display:none}
.user-meta b{display:block; font-size:13px}
.user-meta span{display:block; font-size:11px; opacity:.85}
@media(min-width:620px){ .user-meta{display:block} }

/* ---- body layout ---- */
.body{display:flex; flex:1; min-height:0}
.sidebar{
  width:224px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
  padding:18px 12px; display:flex; flex-direction:column; gap:4px;
}
.side-title{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); padding:4px 10px 10px}
.side-link{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  color:var(--ink-soft); text-decoration:none; font-size:14px; font-weight:500; cursor:pointer;
  border:none; background:none; width:100%; text-align:left;
}
.side-link svg{flex-shrink:0; width:18px; height:18px}
.side-link.active{background:var(--red); color:#fff}
.side-link:not(.active):hover{background:var(--line-soft); color:var(--ink)}
.side-help{
  margin-top:auto; background:var(--line-soft); border-radius:12px; padding:14px;
  font-size:12.5px; color:var(--ink-soft);
}
.side-help b{display:block; color:var(--ink); font-size:13px; margin-bottom:4px}

.main{flex:1; min-width:0; padding:22px 24px 60px; overflow-x:hidden}
.main-head{margin-bottom:18px}
.main-head h1{font-size:21px}
.main-head p{margin:4px 0 0; color:var(--ink-soft); font-size:13.5px}

@media(max-width:720px){
  .sidebar{
    width:100%; flex-direction:row; overflow-x:auto; padding:10px 12px; gap:8px;
    border-right:none; border-bottom:1px solid var(--line);
  }
  .side-title, .side-help{display:none}
  .side-link{flex-shrink:0; white-space:nowrap}
  .main{padding:18px 16px 50px}
}

/* ---- stat tiles ---- */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px}
@media(max-width:560px){ .stats{grid-template-columns:1fr} }
.stat{
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px;
  display:flex; flex-direction:column; gap:2px;
}
.stat b{font-size:26px; font-family:'IBM Plex Mono',monospace}
.stat span{font-size:12.5px; color:var(--ink-soft)}
.stat.warn b{color:var(--warn)}
.stat.ready b{color:var(--success)}

/* ---- search ---- */
.searchbar{display:flex; gap:10px; margin-bottom:16px}
.searchbar input{
  flex:1; min-width:0; padding:10px 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:14px;
}
.searchbar input:focus{outline:2px solid var(--focus); outline-offset:1px}

/* ---- proposal cards ---- */
.queue{display:flex; flex-direction:column; gap:12px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px;
  cursor:pointer; transition:border-color .15s, box-shadow .15s;
}
.card:hover{border-color:var(--red); box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
.card-top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.card-title{font-weight:600; font-size:15px; min-width:0}
.card-meta{font-size:12.5px; color:var(--ink-soft); margin-top:3px}
.tier-badge{
  flex-shrink:0; background:var(--red-bg); color:var(--red-dark); font-weight:700; font-size:12px;
  padding:4px 10px; border-radius:999px; white-space:nowrap;
}
.card-bottom{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center; justify-content:space-between}
.pill-row{display:flex; gap:8px; flex-wrap:wrap}
.pill{
  font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px;
  display:inline-flex; align-items:center; gap:5px;
}
.pill-approved{background:var(--success-bg); color:var(--success)}
.pill-in_review{background:var(--progress-bg); color:var(--progress)}
.pill-unclaimed{background:var(--warn-bg); color:var(--warn)}
.pill-returned{background:var(--danger-bg); color:var(--danger)}
.card-go{font-size:13px; font-weight:600; color:var(--red); white-space:nowrap}

.empty{
  text-align:center; padding:50px 20px; color:var(--ink-soft);
}
.empty svg{width:40px; height:40px; opacity:.5; margin-bottom:10px}
.empty b{display:block; color:var(--ink); font-size:14.5px; margin-bottom:4px}

/* ---- console ---- */
.backlink{
  display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--ink-soft);
  font-size:13.5px; cursor:pointer; padding:4px 0; margin-bottom:14px;
}
.backlink:hover{color:var(--red)}
.ph-card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px;
  margin-bottom:16px;
}
.ph-top{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}
.ph-title{font-size:17px; margin-bottom:6px}
.ph-sub{font-size:13px; color:var(--ink-soft)}
.ph-stat{font-size:12.5px; color:var(--ink-soft); margin-top:2px}

.banner{
  display:flex; align-items:center; gap:10px; background:var(--success-bg);
  color:var(--success); border:1px solid var(--success); border-radius:14px; padding:13px 18px; margin-bottom:16px; font-weight:600; font-size:14px;
}
.banner svg{flex-shrink:0; width:20px; height:20px}

.tracks{display:grid; grid-template-columns:1fr 1fr; gap:16px}
@media(max-width:800px){ .tracks{grid-template-columns:1fr} }

.track{
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px;
  position:relative; display:flex; flex-direction:column; gap:14px;
}
.track-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.track-head h3{font-size:15px}
.track-head p{margin:2px 0 0; font-size:12px; color:var(--ink-soft)}

.abstract{
  background:var(--line-soft); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--ink-soft);
}
.abstract b{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink); margin-bottom:5px}

.budget-table{width:100%; border-collapse:collapse; font-size:13px}
.budget-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding-bottom:6px; font-weight:600}
.budget-table td{padding:6px 0; border-top:1px solid var(--line-soft)}
.budget-table td.amt{text-align:right}
.budget-table tr.flag td{color:var(--warn)}
.budget-table tr.total td{border-top:1.5px solid var(--line); font-weight:700; padding-top:8px}
.subcap-flag{display:inline-flex; align-items:center; gap:4px; font-size:11px; background:var(--warn-bg); color:var(--warn); padding:2px 7px; border-radius:999px; margin-left:6px}

.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-soft)}
textarea{
  width:100%; min-height:70px; resize:vertical; padding:10px 12px; border-radius:10px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink); font-family:inherit; font-size:13.5px;
}
textarea:focus{outline:2px solid var(--focus); outline-offset:1px}
textarea:disabled{opacity:.6}
.field-error{font-size:12px; color:var(--danger); display:none}
.field.invalid textarea{border-color:var(--danger)}
.field.invalid .field-error{display:block}

.track-actions{display:flex; gap:10px; flex-wrap:wrap}
.btn{
  border:none; border-radius:10px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
}
.btn-approve{background:var(--success); color:#fff}
.btn-approve:hover{filter:brightness(1.07)}
.btn-return{background:none; border:1px solid var(--line); color:var(--ink)}
.btn-return:hover{border-color:var(--danger); color:var(--danger)}
.btn-claim{background:var(--red); color:#fff}
.btn-claim:hover{background:var(--red-dark)}
.btn-ghost{background:none; border:none; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; padding:4px 0}
.btn-ghost:hover{color:var(--red)}
.btn-sm{padding:7px 12px; font-size:12.5px}

.claim-prompt{
  background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:12.5px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.claimed-by{font-size:12.5px; color:var(--ink-soft)}
.claimed-by b{color:var(--ink)}

.lock-zone{position:relative}
.lock-overlay{
  position:absolute; inset:0; background:color-mix(in srgb, var(--locked-bg) 88%, transparent);
  border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; cursor:not-allowed; backdrop-filter:blur(1px);
}
.lock-overlay svg{width:20px; height:20px; color:var(--locked)}
.lock-overlay span{font-size:12.5px; font-weight:600; color:var(--locked)}

.reassign-panel{
  background:var(--line-soft); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:10px;
}
.reassign-panel select{
  padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:13px;
}
.reassign-actions{display:flex; gap:8px}

.audit{margin-top:18px}
.audit h3{font-size:13px; color:var(--ink-soft); font-weight:600; margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em}
.audit ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.audit li{display:flex; gap:8px; font-size:12.5px; color:var(--ink-soft)}
.audit li .t{flex-shrink:0; font-family:'IBM Plex Mono',monospace; color:var(--locked)}

/* ---- toasts ---- */
.toasts{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); right:16px; z-index:100; display:flex; flex-direction:column; gap:8px; max-width:min(90vw,340px)}
.toast{
  background:var(--ink); color:var(--paper); padding:11px 15px; border-radius:10px; font-size:13px;
  box-shadow:0 6px 18px rgba(0,0,0,.18); animation:toast-in .18s ease-out;
}
.toast.warn{background:var(--danger)}
@keyframes toast-in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)}}

[hidden]{display:none!important}

/* ===== Theme override: match MFU Research reference (white chrome, red + gold) ===== */
.topbar{background:#fff; color:var(--ink); border-bottom:1px solid var(--line); box-shadow:none}
.logo{background:var(--red); color:#fff; width:40px; height:40px}
.topbar-text b{color:var(--red); font-size:15px; letter-spacing:.3px}
.topbar-text span{color:var(--gold); opacity:1}
.bell{color:var(--ink-soft)}
.bell::after{background:var(--red); border:1.5px solid #fff}
.avatar{background:#fbe3e4; color:var(--red); border:none; font-weight:700}
.user-meta b{color:var(--ink)}
.user-meta span{color:var(--ink-soft); opacity:1}
.sidebar{border-right:1px solid var(--line)}
.side-title{color:var(--ink-soft); letter-spacing:.04em; text-transform:none}
.side-link.active{background:var(--red); color:#fff; box-shadow:0 2px 6px rgba(209,35,41,.28)}
.side-link:not(.active):hover{background:var(--red-bg); color:var(--red)}
.side-help{background:#fafaf9; border:1px solid var(--line)}
.main-head{
  position:relative; overflow:hidden; background:var(--red); color:#fff;
  border-radius:16px; padding:26px 190px 26px 30px; margin-bottom:20px;
  box-shadow:0 4px 14px rgba(209,35,41,.18);
}
.main-head::before{content:""; position:absolute; top:0; right:0; bottom:0; width:170px; background:#c51f26}
.main-head::after{
  content:""; position:absolute; top:50%; right:45px; width:80px; height:80px; transform:translateY(-50%);
  border-radius:50%; background:rgba(186,153,67,.28); border:1.5px solid rgba(186,153,67,.65);
}
.main-head h1,.main-head p{position:relative; z-index:1}
.main-head h1{font-size:24px; color:#fff}
.main-head p{color:rgba(255,255,255,.88)}
.stat{border-radius:16px}
.card{border-radius:16px}
.card:hover{border-color:var(--red); box-shadow:0 4px 14px rgba(209,35,41,.10)}
.tier-badge{background:var(--red-bg); color:var(--red)}
.btn-claim{box-shadow:0 2px 6px rgba(209,35,41,.25)}
.track,.ph-card{border-radius:16px}
@media(max-width:620px){
  .main-head{padding:22px 22px}
  .main-head::before,.main-head::after{display:none}
}
</style>

<div class="shell">

<script>
const CURRENT_USER = 'คุณสุนิสา ทองคำ';
const STATUS_META = {
  approved:  { label:'อนุมัติแล้ว',     pill:'pill-approved' },

};
const BUDGET_LABELS = ['ค่าตอบแทน','ค่าใช้สอย','ค่าวัสดุ','ค่าครุภัณฑ์','ค่าเดินทาง','ค่าใช้จ่ายอื่นๆ'];
const SUBCAP_CATS = ['ค่าเดินทาง','ค่าครุภัณฑ์'];

let state = {
  view: 'queue',
  activeId: null,
  query: '',
  proposals: [
    {
      id:'p1',
      title:'ระบบตรวจจับโรคพืชจากภาพถ่ายใบไม้ด้วยโครงข่ายประสาทเทียมเชิงลึก',
      researcher:'ดร.ปิยะ รักษ์เกียรติ',

      tier:200000,
      submitted:'25 ก.ย. 2569',
      abstract:'งานวิจัยนี้พัฒนาโมเดลโครงข่ายประสาทเทียมเชิงลึกสำหรับจำแนกโรคพืชจากภาพถ่ายใบไม้ โดยมีเป้าหมายให้เกษตรกรในพื้นที่ภาคเหนือวินิจฉัยโรคเบื้องต้นผ่านแอปพลิเคชันมือถือได้อย่างรวดเร็วและแม่นยำ',

function getProposal(id){ return state.proposals.find(p=>p.id===id); }
function thb(n){ return n.toLocaleString('th-TH'); }
function esc(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg, warn){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (warn ? ' warn' : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}

document.querySelectorAll('.side-link').forEach(btn=>{

});

/* ---------------- render: queue ---------------- */
function renderQueue(){
  const list = state.proposals;
  const unclaimed = list.filter(p=>p.finance.status==='unclaimed').length;
  const ready = list.filter(p=>p.content.status==='approved' && p.finance.status==='approved').length;
  const inProgress = list.length - ready;

  const q = state.query.trim().toLowerCase();
  const filtered = list.filter(p =>
    !q || p.title.toLowerCase().includes(q) || p.researcher.toLowerCase().includes(q) || p.school.toLowerCase().includes(q)
  );

  const cards = filtered.map(p => `
    <div class="card" tabindex="0" data-open="${p.id}">
      <div class="card-top">
        <div>
          <div class="card-title">${esc(p.title)}</div>
          <div class="card-meta">${esc(p.researcher)} · ${esc(p.school)} · ยื่นเมื่อ ${esc(p.submitted)}</div>
        </div>
        <span class="tier-badge">เพดาน ${thb(p.tier)} บ.</span>
      </div>
      <div class="card-bottom">
        <div class="pill-row">
          <span class="pill ${STATUS_META[p.content.status].pill}">เนื้อหา: ${STATUS_META[p.content.status].label}</span>
          <span class="pill ${STATUS_META[p.finance.status].pill}">การเงิน: ${STATUS_META[p.finance.status].label}</span>
        </div>
        <span class="card-go">เปิดดูรายละเอียด →</span>
      </div>
    </div>`).join('');

  const emptyState = `
    <div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <b>ไม่พบข้อเสนอที่ค้นหา</b>
      ลองใช้คำค้นอื่น หรือล้างคำค้นเพื่อดูข้อเสนอทั้งหมด
    </div>`;

  document.getElementById('main').innerHTML = `
    <div class="main-head">
      <h1>คิวตรวจประเมินข้อเสนอโครงการ</h1>
      <p>ตรวจสอบคู่ขนาน 2 สาย — สายเนื้อหา (อนุกรรมการ) และสายการเงิน (เจ้าหน้าที่การเงิน แบบรับเรื่องเอง)</p>
    </div>
    <div class="stats">
      <div class="stat warn"><b class="num">${unclaimed}</b><span>สายการเงินรอรับเรื่อง</span></div>
      <div class="stat"><b class="num">${inProgress}</b><span>กำลังอยู่ระหว่างประเมิน</span></div>
      <div class="stat ready"><b class="num">${ready}</b><span>พร้อมส่งคณะกรรมการบริหาร</span></div>
    </div>
    <div class="searchbar">
      <input id="search" type="text" placeholder="ค้นหาชื่อโครงการ ผู้วิจัย หรือสำนักวิชา..." value="${esc(state.query)}">
    </div>
    <div class="queue">${filtered.length ? cards : emptyState}</div>
  `;

  document.getElementById('search').addEventListener('input', e=>{
    state.query = e.target.value; renderQueue();
    document.getElementById('search').focus();
    const v = document.getElementById('search'); v.value = state.query; v.setSelectionRange(v.value.length, v.value.length);
  });
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>openConsole(el.dataset.open));
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') openConsole(el.dataset.open); });

function wireConsoleActions(p){
  document.querySelectorAll('[data-lock-click]').forEach(el=>{
    el.addEventListener('click', ()=> toast('ไม่สามารถแก้ไขได้: สายนี้ได้รับการอนุมัติแล้ว', true));
  });

  const claimBtn = document.querySelector('[data-action="claim"]');
  if(claimBtn) claimBtn.addEventListener('click', ()=>{
    p.finance.claimedBy = CURRENT_USER;
    p.finance.status = 'in_review';
    p.log.push({t: nowStamp(), text: CURRENT_USER + ' รับเรื่องสายการเงิน (Claim)'});
    toast('รับเรื่องสายการเงินเรียบร้อย');
    renderConsole();
  });

  document.querySelectorAll('[data-action="approve"], [data-action="return"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const track = btn.dataset.track;
      const field = document.getElementById(track+'-field');
      const textarea = document.getElementById(track+'-comment');
      const comment = textarea.value.trim();
      if(!comment){
        field.classList.add('invalid');
        textarea.focus();
        return;
      }
      field.classList.remove('invalid');
      const t = p[track];
      t.comment = comment;
      if(btn.dataset.action === 'approve'){
        t.status = 'approved';
        p.log.push({t: nowStamp(), text: (track==='finance'?(t.claimedBy||CURRENT_USER):'อนุกรรมการ') + ' อนุมัติสาย' + (track==='content'?'เนื้อหา':'การเงิน')});
        toast('บันทึกผลอนุมัติแล้ว');
        if(p.content.status==='approved' && p.finance.status==='approved'){
          p.log.push({t: nowStamp(), text:'ระบบ: ทั้งสองสายอนุมัติแล้ว — สถานะเปลี่ยนเป็น "พร้อมส่งต่อคณะกรรมการบริหาร"'});
        }
      } else {
        t.status = 'returned';
        p.log.push({t: nowStamp(), text: (track==='finance'?(t.claimedBy||CURRENT_USER):'อนุกรรมการ') + ' ส่งกลับแก้ไขสาย' + (track==='content'?'เนื้อหา':'การเงิน')});
        toast('ส่งกลับให้นักวิจัยแก้ไขแล้ว');
      }
      renderConsole();
    });
  });

  document.querySelectorAll('[data-action="resubmit"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const track = btn.dataset.track;
      p[track].status = 'in_review';
      p.log.push({t: nowStamp(), text:'นักวิจัยส่งฉบับแก้ไขกลับมา — ระบบนำทางกลับไปยังผู้ประเมินเดิมของสาย' + (track==='content'?'เนื้อหา':'การเงิน') + ' เท่านั้น'});
      toast('จำลองการส่งฉบับแก้ไขกลับมาแล้ว');
      renderConsole();
    });
  });

  const openReassign = document.querySelector('[data-action="open-reassign"]');
  if(openReassign) openReassign.addEventListener('click', ()=>{
    document.getElementById('reassign-panel').hidden = false;
  });
  const cancelReassign = document.querySelector('[data-action="reassign-cancel"]');
  if(cancelReassign) cancelReassign.addEventListener('click', ()=>{
    document.getElementById('reassign-panel').hidden = true;
  });
  const confirmReassign = document.querySelector('[data-action="reassign-confirm"]');
  if(confirmReassign) confirmReassign.addEventListener('click', ()=>{
    const newName = document.getElementById('reassign-select').value;
    const oldName = p.finance.claimedBy;
    if(newName === oldName){ toast('เลือกเจ้าหน้าที่คนเดิม — ไม่มีการเปลี่ยนแปลง'); return; }
    p.finance.claimedBy = newName;
    p.log.push({t: nowStamp(), text:'ผู้ดูแลระบบ มอบหมายสายการเงินใหม่ให้ ' + newName + ' แทน ' + oldName + ' (Admin Reassign)'});
    toast('มอบหมายสายการเงินใหม่เรียบร้อย');
    renderConsole();
  });
}

function nowStamp(){ return '09 ต.ค. 2569 ' + new Date().getHours().toString().padStart(2,'0') + ':' + new Date().getMinutes().toString().padStart(2,'0'); }

function render(){
  if(state.view === 'queue') renderQueue();
  else renderConsole();
}
render();
</script>

</body></html>
