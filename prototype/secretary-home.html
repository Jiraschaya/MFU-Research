<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ภาพรวมสำนักวิชา — RGMS ทุนวิจัย มฟล.</title>
<link rel="stylesheet" href="style.css">

<style>
/* ===== KPI Cards ===== */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px;
}

.kpi-card {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    min-width: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-top: 4px solid #b78a22;
    border-radius: 12px;
    padding: 24px 28px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, .06);
    cursor: pointer;
    transition:
        transform .16s ease,
        box-shadow .16s ease,
        border-color .16s ease,
        background .16s ease;
}

.kpi-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(15, 23, 42, .12);
}

.kpi-card:focus-visible {
    outline: 3px solid #2563eb;
    outline-offset: 3px;
}

.kpi-card[aria-pressed="true"] {
    border-color: #b78a22;
    background: #fffaf0;
    box-shadow: 0 0 0 2px rgba(183, 138, 34, .18);
}

.kpi-card__value {
    display: block;
    font-size: 36px;
    line-height: 1.15;
    font-weight: 700;
    margin-bottom: 6px;
}

.kpi-card__label {
    display: block;
    font-size: 15px;
    line-height: 1.45;
}

#project-list {
    scroll-margin-top: 24px;
}

@media (max-width: 1000px) {
    .kpi-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 560px) {
    .kpi-grid {
        grid-template-columns: 1fr;
    }

    .kpi-card {
        padding: 18px 20px;
    }
}
</style>
</head>

<body>

<div id="app-nav-root"></div>

<main class="section">
    <div class="container stack gap-5">

        <!-- Page heading -->
        <div class="page-head">
            <span class="text-overline">
                เลขาสำนักวิชา · ผู้รับผิดชอบ (FR-75)
            </span>

            <h1 class="text-headline">
                ภาพรวมทุนวิจัยของสำนักวิชา
            </h1>

            <p class="text-muted" id="sub"></p>
        </div>

        <!-- Permission notice -->
        <div class="notice notice--info">
            <span class="notice__body">
                หน้านี้เป็นมุมมองติดตามเท่านั้น เลขานุการไม่สามารถเปลี่ยนสถานะ
                โครงการจากหน้านี้ได้ ข้อมูลจำกัดตามสำนักวิชาที่กำหนดในบทบาทผู้ใช้
            </span>
        </div>

        <!-- KPI cards: click to filter -->
        <div
            id="kpis"
            class="kpi-grid"
            aria-label="สรุปโครงการ กดการ์ดเพื่อกรองรายการด้านล่าง"
            aria-live="polite">
        </div>

        <!-- Project list -->
        <section
            id="project-list"
            class="card card--pad-sm"
            aria-labelledby="projects-heading">

            <div class="card__header">
                <h2 class="text-subhead" id="projects-heading">
                    โครงการของนักวิจัยในสำนักวิชา
                </h2>

                <span class="text-sm text-muted num" id="count"></span>
            </div>

            <!-- Search, filter and sort -->
            <div class="grid grid-3" style="margin-bottom:16px;">

                <div class="field">
                    <label class="field__label" for="search-projects">
                        ค้นหาโครงการ
                    </label>

                    <input
                        class="field__control"
                        id="search-projects"
                        type="search"
                        autocomplete="off"
                        placeholder="รหัส ชื่อโครงการ หรือผู้วิจัย">
                </div>

                <div class="field">
                    <label class="field__label" for="filter-status">
                        กรองตามสถานะโครงการ
                    </label>

                    <select class="field__control" id="filter-status">
                        <option value="">ทุกสถานะ</option>
                        <option value="draft">ฉบับร่าง</option>
                        <option value="submitted">ยื่นแล้ว</option>
                        <option value="screening">ตรวจสอบเบื้องต้น</option>
                        <option value="review">อยู่ระหว่างผู้ทรงคุณวุฒิพิจารณา</option>
                        <option value="committee">รอมติคณะกรรมการ</option>
                        <option value="revise">รอแก้ไข</option>
                        <option value="approved">อนุมัติแล้ว</option>
                        <option value="ongoing">กำลังดำเนินโครงการ</option>
                        <option value="progress">รายงานความก้าวหน้า</option>
                        <option value="final">รายงานฉบับสมบูรณ์</option>
                        <option value="financial">ดำเนินการด้านการเงิน</option>
                        <option value="closed">ปิดโครงการ</option>
                    </select>
                </div>

                <div class="field">
                    <label class="field__label" for="sort-projects">
                        เรียงลำดับ
                    </label>

                    <select class="field__control" id="sort-projects">
                        <option value="id-desc">รหัสโครงการ: ใหม่ไปเก่า</option>
                        <option value="id-asc">รหัสโครงการ: เก่าไปใหม่</option>
                        <option value="title-asc">ชื่อโครงการ: ก-ฮ</option>
                    </select>
                </div>

            </div>

            <p
                class="text-sm text-muted"
                id="result-summary"
                aria-live="polite">
            </p>

            <!-- Projects table -->
            <div class="table-wrap">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">รหัส</th>
                            <th scope="col">ชื่อโครงการ / ผู้วิจัย</th>
                            <th scope="col">สถานะ</th>
                            <th scope="col">รับรองสำนักวิชา</th>
                            <th scope="col">ความเคลื่อนไหวล่าสุด</th>
                        </tr>
                    </thead>

                    <tbody id="rows"></tbody>
                </table>
            </div>

        </section>
    </div>
</main>

<script src="shared.js"></script>

<script>
(function () {
    "use strict";

    // Initialize navigation
    RGMS.renderAppNav("secretary-home");

    var role = RGMS.currentRole() || {};
    var school = role.school || "สำนักวิชาเทคโนโลยีสารสนเทศ";

    var rows = document.getElementById("rows");
    var search = document.getElementById("search-projects");
    var filter = document.getElementById("filter-status");
    var sort = document.getElementById("sort-projects");
    var kpis = document.getElementById("kpis");

    // Currently selected KPI card
    var selectedKPI = "all";

    document.getElementById("sub").textContent =
        (role.name || "ผู้ใช้งาน") + " · " + school;


    // ===== Escape HTML to protect displayed data =====
    function escapeHTML(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[ch];
        });
    }


    // ===== Get projects belonging to this school =====
    function getProjects() {
        return (Array.isArray(RGMS.PROJECTS) ? RGMS.PROJECTS : [])
            .filter(function (project) {
                return project && project.school === school;
            });
    }


    // ===== Read project status =====
    function getStatus(project) {
        return String(project.status || "");
    }


    // ===== Group statuses for KPI cards =====
    function statusCategory(status) {
        // Projects awaiting consideration
        if ([
            "draft",
            "submitted",
            "screening",
            "review",
            "committee",
            "revise"
        ].indexOf(status) >= 0) {
            return "pipeline";
        }

        // Approved projects waiting to begin are counted separately.
        if (status === "approved") {
            return "approved";
        }

        // Projects currently being carried out
        if ([
            "ongoing",
            "progress",
            "final",
            "financial"
        ].indexOf(status) >= 0) {
            return "active";
        }

        // Completed projects
        if (status === "closed") {
            return "closed";
        }

        return "other";
    }


    // ===== Render KPI cards =====
    function renderKPIs(projects) {
        var counts = {
            total: projects.length,
            pipeline: 0,
            approved: 0,
            active: 0,
            closed: 0,
            other: 0
        };

        projects.forEach(function (project) {
            counts[statusCategory(getStatus(project))]++;
        });

        var cards = [
            ["all", "โครงการทั้งหมด", counts.total],
            ["pipeline", "อยู่ระหว่างพิจารณา", counts.pipeline],
            ["approved", "อนุมัติแล้ว / รอเริ่มดำเนินการ", counts.approved],
            ["active", "กำลังดำเนินการ", counts.active],
            ["closed", "ปิดโครงการแล้ว", counts.closed]
        ];

        kpis.innerHTML = cards.map(function (card) {
            var isSelected = selectedKPI === card[0];

            return `
                <button
                    type="button"
                    class="kpi-card"
                    data-kpi="${card[0]}"
                    aria-pressed="${isSelected ? "true" : "false"}"
                    aria-controls="project-list">

                    <span class="kpi-card__value">${card[2]}</span>

                    <span class="kpi-card__label">
                        ${card[1]} · โครงการ
                    </span>
                </button>
            `;
        }).join("");
    }


    // ===== Show latest activity =====
    function lastActivity(project) {
        var history = Array.isArray(project.history)
            ? project.history
            : [];

        var latest = history.length
            ? history[history.length - 1]
            : null;

        if (!latest) {
            return '<span class="text-sm text-muted">' +
                'ไม่มีประวัติความเคลื่อนไหว</span>';
        }

        return `
            <span class="text-sm">
                ${escapeHTML(latest.action || "มีการอัปเดต")}
            </span>

            <div class="text-sm text-muted num">
                ${escapeHTML(latest.at || "ไม่ระบุเวลา")}
            </div>
        `;
    }


    // ===== Compare project IDs =====
    function compareId(a, b) {
        var aId = String(a.id == null ? "" : a.id);
        var bId = String(b.id == null ? "" : b.id);

        if (
            aId !== "" &&
            bId !== "" &&
            !isNaN(Number(aId)) &&
            !isNaN(Number(bId))
        ) {
            return Number(aId) - Number(bId);
        }

        return aId.localeCompare(bId, "th", { numeric: true });
    }


    // ===== Render project table =====
    function render() {
        var allProjects = getProjects();

        renderKPIs(allProjects);

        var query = search.value.trim().toLocaleLowerCase("th");
        var selectedStatus = filter.value;

        var visibleProjects = allProjects.filter(function (project) {
            var haystack = [
                project.id,
                project.title,
                project.pi
            ].join(" ").toLocaleLowerCase("th");

            var categoryMatches =
                selectedKPI === "all" ||
                statusCategory(getStatus(project)) === selectedKPI;

            var searchMatches =
                !query || haystack.indexOf(query) >= 0;

            var statusMatches =
                !selectedStatus || getStatus(project) === selectedStatus;

            return categoryMatches && searchMatches && statusMatches;
        });


        // Sort projects
        visibleProjects.sort(function (a, b) {
            if (sort.value === "id-asc") {
                return compareId(a, b);
            }

            if (sort.value === "title-asc") {
                return String(a.title || "")
                    .localeCompare(String(b.title || ""), "th");
            }

            return compareId(b, a);
        });


        // Update result counts
        document.getElementById("count").textContent =
            allProjects.length + " โครงการทั้งหมด";

        document.getElementById("result-summary").textContent =
            "แสดง " + visibleProjects.length +
            " จาก " + allProjects.length +
            " โครงการใน " + school;


        // Empty state
        if (visibleProjects.length === 0) {
            rows.innerHTML = `
                <tr>
                    <td colspan="5"
                        class="text-sm text-muted text-center"
                        style="padding:20px;">

                        ${
                            allProjects.length
                                ? "ไม่พบโครงการที่ตรงกับตัวกรอง"
                                : "ยังไม่มีโครงการในสำนักวิชานี้"
                        }

                    </td>
                </tr>
            `;
            return;
        }


        // School endorsement labels
        var endMap = {
            pending: ["รอรับรอง", "badge-revise"],
            passed: ["รับรองแล้ว", "badge-ok"],
            returned: ["ส่งกลับแก้ไข", "badge-revise"]
        };


        // Build project rows
        rows.innerHTML = visibleProjects.map(function (project) {
            var endStatus = RGMS.endorseStatus(project.id);

            var endorsement = endMap[endStatus] ||
                ["ไม่อยู่ในขั้นตอนรับรอง", ""];

            var statusHTML = RGMS.badgeHTML(project.status);

            return `
                <tr
                    class="is-clickable"
                    data-id="${escapeHTML(project.id)}"
                    tabindex="0"
                    role="link"
                    aria-label="เปิดรายละเอียดโครงการ ${escapeHTML(project.title || project.id)}">

                    <td class="num">
                        ${escapeHTML(project.id)}
                    </td>

                    <td>
                        <div style="font-weight:600;">
                            ${escapeHTML(project.title || "ไม่ระบุชื่อโครงการ")}
                        </div>

                        <div class="text-sm text-muted">
                            ${escapeHTML(project.pi || "ไม่ระบุผู้วิจัย")}
                        </div>
                    </td>

                    <td>
                        ${statusHTML}
                    </td>

                    <td>
                        ${
                            endorsement[1]
                                ? `<span class="badge ${endorsement[1]}">${endorsement[0]}</span>`
                                : `<span class="text-sm text-muted">${endorsement[0]}</span>`
                        }
                    </td>

                    <td>
                        ${lastActivity(project)}
                    </td>
                </tr>
            `;
        }).join("");
    }


    // ===== Click KPI cards to filter and scroll =====
    kpis.addEventListener("click", function (event) {
        var card = event.target.closest("button[data-kpi]");

        if (!card) {
            return;
        }

        selectedKPI = card.getAttribute("data-kpi");

        // Clear status filter so it does not conflict with the selected card.
        filter.value = "";

        render();

        document.getElementById("project-list").scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    });


    // ===== Open project detail =====
    function openProject(row) {
        var projectId = row.getAttribute("data-id");

        if (!projectId) {
            return;
        }

        window.location.href =
            "project-detail.html?id=" + encodeURIComponent(projectId);
    }

    rows.addEventListener("click", function (event) {
        var row = event.target.closest("tr[data-id]");

        if (row) {
            openProject(row);
        }
    });

    rows.addEventListener("keydown", function (event) {
        if (event.key !== "Enter" && event.key !== " ") {
            return;
        }

        var row = event.target.closest("tr[data-id]");

        if (!row) {
            return;
        }

        event.preventDefault();
        openProject(row);
    });


    // ===== Search, filter and sort events =====
    search.addEventListener("input", render);

    filter.addEventListener("change", function () {
        // Manual status filtering resets the selected KPI card.
        selectedKPI = "all";
        render();
    });

    sort.addEventListener("change", render);


    // Initial render
    render();

})();
</script>

</body>
</html>
