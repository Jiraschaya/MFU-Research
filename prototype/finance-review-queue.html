<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คิวตรวจการเงิน — RGMS ทุนวิจัย มฟล.</title>
<link rel="stylesheet" href="style.css">
<style>
  /* จุดสถานะ: เขียว = ตรวจแล้ว / เหลือง = รอตรวจ + กระพริบ */
  .status-badge::before { animation: status-blink 1.2s ease-in-out infinite; }
  .status-badge--done::before { background: #10B981; box-shadow: 0 0 8px 2px rgba(16, 185, 129, .65); }
  .status-badge--wait::before { background: #F5B301; box-shadow: 0 0 8px 2px rgba(245, 179, 1, .75); }
  @keyframes status-blink {
    0%, 100% { opacity: 1;   transform: scale(1.1); }
    50%      { opacity: .25; transform: scale(.8); }
  }
  @media (prefers-reduced-motion: reduce) { .status-badge::before { animation: none; } }

  /* นำขอบสีแดงเข้มตอนชี้เมาส์ที่ปุ่มออก */
  .btn-secondary:hover { border-color: #CBD5E1 !important; color: var(--color-primary-strong) !important; }
  .btn-primary:hover   { border-color: #680E12 !important; }

  .page-head { margin-bottom: 0; }

  /* การ์ดสรุปแบบกดกรองได้ (ชุดเดียวกับหน้าประธาน/คณบดี) */
  .kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;width:100%}
  .kpi-card{appearance:none;-webkit-appearance:none;position:relative;display:flex;flex-direction:column;justify-content:center;width:100%;min-width:0;min-height:125px;padding:24px 28px;overflow:hidden;text-align:left;font:inherit;color:#0f172a;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 4px 12px rgba(15,23,42,.06);cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
  .kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#991b1b,#c79a24)}
  .kpi-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(15,23,42,.12)}
  .kpi-card:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
  .kpi-card[aria-pressed="true"]{background:#fffaf0;box-shadow:0 0 0 2px rgba(183,138,34,.25),0 4px 12px rgba(15,23,42,.06)}
  .kpi-card__value{display:block;margin-bottom:6px;font-size:36px;line-height:1.15;font-weight:700}
  .kpi-card__label{display:block;font-size:15px;line-height:1.45;color:#334155}
  .filter-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .filter-bar[hidden],.card[hidden]{display:none}
  @media (max-width:800px){.kpi-grid{grid-template-columns:1fr}.kpi-card{min-height:110px;padding:20px}}

  /* PROTOTYPE: ปุ่มรีเซ็ตวงกลม (ลูกศรตามเข็มนาฬิกา) มุมล่างขวา */
  .reset-fab {
    position: fixed; right: 24px; bottom: 24px; z-index: 40;
    width: 52px; height: 52px; border-radius: 50%; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #96181F 0%, #851419 100%);
    border: 1px solid #680E12; color: #fff; cursor: pointer;
    box-shadow: 0 4px 12px rgba(133, 20, 25, .35);
    transition: transform .2s, box-shadow .2s;
  }
  .reset-fab:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(133, 20, 25, .4); color: #fff; }
  .reset-fab svg { width: 24px; height: 24px; transition: transform .5s; }
  .reset-fab:hover svg, .reset-fab.is-spinning svg { transform: rotate(360deg); }
</style>
</head>
<body>
<div id="app-nav-root"></div>
<main class="section">
  <div class="container stack gap-5">

    <!-- หัวข้อ + กล่องกติกา (ชิดกัน) -->
    <div class="stack gap-3">
      <div class="page-head">
        <span class="text-overline">แทร็กการเงิน · claim-based (FR-83)</span>
        <h1 class="text-headline">คิวตรวจการเงิน</h1>
      </div>

      <div class="notice notice--info">
        <span class="notice__title">กติกาการรับตรวจ</span>
        <span class="notice__body">ใครกด "รับตรวจ" โครงการไหนก่อน จะผูกเป็นผู้รับผิดชอบแทร็กการเงินของโครงการนั้นต่อเนื่องทุกรอบ (รวมรอบตรวจซ้ำหลังแก้ไข) — ไม่สุ่มมอบหมายใหม่ทุกครั้ง</span>
      </div>
    </div>

    <!-- การ์ดสรุป 3 ใบ: กดเพื่อกรองรายการ กดซ้ำเพื่อกลับมุมมองเดิม -->
    <div class="kpi-grid" id="kpis" aria-label="สรุปคิวตรวจการเงิน กดการ์ดเพื่อกรองรายการ กดซ้ำเพื่อกลับมุมมองเดิม"></div>

    <div class="filter-bar" id="filter-bar" hidden>
      <span class="text-sm text-muted" id="filter-label"></span>
    </div>

    <div class="card card--pad-sm" id="unclaimed-section">
      <div class="card__header"><h2 class="text-subhead">รอรับตรวจ (ยังไม่มีผู้รับผิดชอบ)</h2></div>
      <div class="grid grid-2" id="unclaimed"></div>
    </div>

    <div class="card card--pad-sm" id="mine-section">
      <div class="card__header"><h2 class="text-subhead">งานของฉัน</h2></div>
      <div class="grid grid-2" id="mine"></div>
    </div>

  </div>
</main>

<!-- PROTOTYPE ONLY: รีเซ็ตเพื่อทดสอบระบบซ้ำ -->
<button type="button" class="reset-fab" id="reset-fab" title="รีเซ็ตเพื่อทดสอบใหม่ (ผลตรวจ / ข้อคิดเห็น / การรับตรวจ / การเปลี่ยนผู้รับผิดชอบ)" aria-label="รีเซ็ตเพื่อทดสอบใหม่">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
</button>

<script src="shared.js"></script>
<script>
  RGMS.renderAppNav("finance-review-queue");
  var me = RGMS.currentRole().name;

  var inPhase = RGMS.PROJECTS.filter(function (p) { return RGMS.inReviewPhase(p.status); });
  var unclaimed = inPhase.filter(function (p) { return !RGMS.financeOwnerOf(p.id); });
  var mine = inPhase.filter(function (p) { return RGMS.financeOwnerOf(p.id) === me; });

  /* ตรวจแล้ว = สถานะแทร็กการเงินไม่ใช่ "pending" (ถูกตั้งเมื่อกด "บันทึกผลตรวจการเงิน" ในหน้า finance-review-console) */
  function isChecked(p) { return RGMS.financeTrackStatus(p.id) !== "pending"; }

  function statusBadgeHTML(kind) {   // kind: "unclaimed" | "wait" | "done"
    if (kind === "done") return '<span class="badge badge-ok status-badge status-badge--done">ตรวจแล้ว</span>';
    return '<span class="badge badge-wait status-badge status-badge--wait">' + (kind === "unclaimed" ? 'รอรับตรวจ' : 'รอตรวจ') + '</span>';
  }

  /* ประเภททุนของโครงการ (ชื่อเต็ม) */
  function tierLabel(p) { return (p.tier && RGMS.TIERS[p.tier]) ? RGMS.TIERS[p.tier].label : ""; }

  /* แทร็กเนื้อหา: รอประเมิน (เหลือง กระพริบ) / ประเมินแล้ว (เขียว กระพริบ) / มีข้อคิดเห็น */
  function contentBadgeHTML(st) {
    if (st === "pending") return '<span class="badge badge-wait status-badge status-badge--wait">รอประเมิน</span>';
    if (st === "cleared") return '<span class="badge badge-ok status-badge status-badge--done">ประเมินแล้ว</span>';
    return RGMS.trackBadgeHTML(st);
  }

  function card(p, opts) {
    var cont = RGMS.contentTrackStatus(p.id);
    return '<div class="card stack gap-3">' +
      '<div class="between"><span class="text-mono text-muted">' + p.id + '</span>' + statusBadgeHTML(opts.kind) + '</div>' +
      '<div style="font-weight:600; font-size:16px; line-height:1.4;">' + p.title + '</div>' +
      '<div class="text-sm text-muted">' + p.school + (tierLabel(p) ? ' · ' + tierLabel(p) : '') + ' · งบที่ขอ ' + RGMS.fmtBaht(p.budgetReq) + '</div>' +
      '<div class="cluster gap-2 text-sm"><span class="text-muted">แทร็กเนื้อหา:</span>' + contentBadgeHTML(cont) + '</div>' +
      (opts.owner ? '<div class="between text-sm"><span class="text-muted">ผู้รับผิดชอบ: <b>' + opts.owner + '</b></span>' +
        '<button class="btn btn-ghost btn-sm" data-reassign="' + p.id + '" title="เปลี่ยนผู้รับผิดชอบแทร็กการเงิน">เปลี่ยน ✎</button></div>' : '') +
      opts.action +
    '</div>';
  }
  function openReassign(pid) {
    var p = RGMS.getProject(pid); var cur = RGMS.financeOwnerOf(pid);
    function badge(n) { return n <= 3 ? "badge-ok" : n <= 6 ? "badge-wait" : "badge-reject"; }
    var cards = RGMS.FINANCE_REVIEWERS.map(function (name) {
      var load = RGMS.financeLoad(name), checked = name === cur;
      return '<label style="display:flex; gap:12px; align-items:center; padding:12px; border:1px solid ' + (checked ? "var(--color-primary)" : "var(--color-border)") + '; border-radius:var(--radius-sm); cursor:pointer; background:var(--color-surface);">' +
        '<input type="radio" name="finance-owner" value="' + name + '"' + (checked ? " checked" : "") + ' style="width:18px; height:18px; accent-color:var(--color-primary); flex-shrink:0;">' +
        '<div class="flex-1" style="min-width:0;"><div style="font-weight:600;">' + name + (checked ? ' <span class="text-sm text-muted">(ปัจจุบัน)</span>' : "") + '</div></div>' +
        '<span class="badge ' + badge(load) + '">ถือ ' + load + '</span></label>';
    }).join("");
    RGMS.modal({
      title: "เปลี่ยนผู้รับผิดชอบแทร็กการเงิน",
      body: '<div class="notice notice--info" style="margin-bottom:12px;"><span class="notice__body"><b>' + p.id + '</b> · ' + p.title + '<br>ผู้รับผิดชอบปัจจุบัน: <b>' + cur + '</b> — จนท.การเงินแลกกันเองได้ ผู้ที่รับต่อจะดูแลแทร็กนี้ต่อเนื่องทุกรอบแทน</span></div>' +
        '<div class="stack gap-2">' + cards + '</div>',
      foot: '<button class="btn btn-secondary btn-md" data-close>ยกเลิก</button><button class="btn btn-primary btn-md" id="save-finance-owner">บันทึกการมอบหมาย</button>',
      onMount: function (back, close) {
        back.querySelector("#save-finance-owner").addEventListener("click", function () {
          var sel = back.querySelector('input[name="finance-owner"]:checked'); if (!sel) return;
          var name = sel.value; close();
          if (name !== cur) { RGMS.setFinanceOwner(pid, name); RGMS.toast("เปลี่ยนผู้รับผิดชอบแทร็กการเงิน " + pid + ": " + cur + " → " + name, "accent"); }
          render();
        });
      }
    });
  }

  var selectedKPI = "all", savedScroll = 0;
  var FILTER_NAME = { unclaimed: "รอรับตรวจ", pending: "รอตรวจ", done: "ตรวจแล้ว" };

  function render() {
    inPhase = RGMS.PROJECTS.filter(function (p) { return RGMS.inReviewPhase(p.status); });
    unclaimed = inPhase.filter(function (p) { return !RGMS.financeOwnerOf(p.id); });
    mine = inPhase.filter(function (p) { return RGMS.financeOwnerOf(p.id) === me; });

    // เรียงงานของฉัน: ยังไม่ตรวจขึ้นก่อน (ซ้าย→ขวา) ตรวจแล้วถอยไปท้าย — ลำดับเดิมในกลุ่มเดียวกันคงไว้
    mine = mine
      .map(function (p, i) { return { p: p, i: i, done: isChecked(p) }; })
      .sort(function (a, b) { return (a.done - b.done) || (a.i - b.i); })
      .map(function (x) { return x.p; });

    var doneCount = mine.filter(isChecked).length;
    var cards = [
      { id: "unclaimed", label: "รอรับตรวจ", value: unclaimed.length, target: "unclaimed-section" },
      { id: "pending",   label: "รอตรวจ",    value: mine.length - doneCount, target: "mine-section" },
      { id: "done",      label: "ตรวจแล้ว",  value: doneCount, target: "mine-section" }
    ];
    document.getElementById("kpis").innerHTML = cards.map(function (c) {
      return '<button type="button" class="kpi-card" data-kpi="' + c.id + '" aria-pressed="' + (selectedKPI === c.id) + '" aria-controls="' + c.target + '">' +
        '<span class="kpi-card__value">' + c.value + '</span>' +
        '<span class="kpi-card__label">' + c.label + ' · โครงการ</span></button>';
    }).join("");

    // กรอง: รอรับตรวจ → แสดงเฉพาะส่วนรอรับตรวจ · รอตรวจ/ตรวจแล้ว → แสดงเฉพาะงานของฉันตามสถานะนั้น
    var mineShown = mine.filter(function (p) {
      return selectedKPI === "pending" ? !isChecked(p) : selectedKPI === "done" ? isChecked(p) : true;
    });
    document.getElementById("unclaimed-section").hidden = selectedKPI === "pending" || selectedKPI === "done";
    document.getElementById("mine-section").hidden = selectedKPI === "unclaimed";
    document.getElementById("filter-bar").hidden = selectedKPI === "all";
    document.getElementById("filter-label").textContent = selectedKPI === "all" ? "" :
      "กำลังกรอง: " + FILTER_NAME[selectedKPI] + " (" + (selectedKPI === "unclaimed" ? unclaimed.length : mineShown.length) + " โครงการ) — กดการ์ดเดิมอีกครั้งเพื่อแสดงทั้งหมด";

    document.getElementById("unclaimed").innerHTML = unclaimed.length ? unclaimed.map(function (p) {
      return card(p, { kind: "unclaimed", action: '<button class="btn btn-primary btn-md btn-block" data-claim="' + p.id + '">รับตรวจ →</button>' });
    }).join("") : '<p class="text-sm text-muted">ไม่มีโครงการรอรับตรวจในขณะนี้</p>';

    document.getElementById("mine").innerHTML = mineShown.length ? mineShown.map(function (p) {
      var done = isChecked(p);
      return card(p, { kind: done ? "done" : "wait", owner: me, action: '<a class="btn ' + (done ? 'btn-secondary' : 'btn-primary') + ' btn-md btn-block" href="finance-review-console.html?id=' + p.id + '">' + (done ? 'ตรวจสอบผลตรวจ' : 'เริ่มตรวจการเงิน →') + '</a>' });
    }).join("") : '<p class="text-sm text-muted">' + (selectedKPI === "all" ? 'คุณยังไม่ได้รับตรวจโครงการใด' : 'ยังไม่มีโครงการที่' + FILTER_NAME[selectedKPI]) + '</p>';

    document.querySelectorAll("[data-claim]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-claim");
        RGMS.claimFinance(id, me);
        render();   // ย้ายการ์ดไป "งานของฉัน" เท่านั้น — ไม่เด้งเข้าหน้าตรวจ ต้องกด "เริ่มตรวจการเงิน →" เอง
        RGMS.toast("รับตรวจ " + id + " แล้ว — อยู่ในการ์ด \"งานของฉัน\"", "accent");
      });
    });
    document.querySelectorAll("[data-reassign]").forEach(function (btn) {
      btn.addEventListener("click", function () { openReassign(btn.getAttribute("data-reassign")); });
    });

    RGMS.refreshNavCounts();   // อัปเดตเลขใน sidebar ให้ตรงกับงานค้าง (รอรับตรวจ + รอตรวจของฉัน)
  }
  render();

  document.getElementById("kpis").addEventListener("click", function (e) {
    var card = e.target.closest("[data-kpi]");
    if (!card) return;
    var next = card.getAttribute("data-kpi");
    if (next === selectedKPI) {                              // กดการ์ดเดิมซ้ำ = ยกเลิกตัวกรอง กลับจุดเดิม
      selectedKPI = "all"; render();
      window.scrollTo({ top: savedScroll, behavior: "smooth" });
      return;
    }
    if (selectedKPI === "all") savedScroll = window.pageYOffset;
    selectedKPI = next; render();
    var target = document.getElementById(next === "unclaimed" ? "unclaimed-section" : "mine-section");
    if (target && !target.hidden) target.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  // PROTOTYPE ONLY: รีเซ็ตผลตรวจ + ข้อคิดเห็น + การรับตรวจ → ทดสอบระบบซ้ำ
  document.getElementById("reset-fab").addEventListener("click", function () {
    var b = this; b.classList.add("is-spinning");
    RGMS.resetFinanceReview();
    render();
    setTimeout(function () { b.classList.remove("is-spinning"); }, 600);
  });

  // กลับมาจากหน้า finance-review-console (ปุ่ม Back / bfcache) หรือสถานะเปลี่ยนจากแท็บอื่น → วาดใหม่
  window.addEventListener("pageshow", function (e) { if (e.persisted) render(); });
  window.addEventListener("focus", render);
  window.addEventListener("storage", render);
</script>
</body>
</html>
